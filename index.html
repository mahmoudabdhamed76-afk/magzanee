<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#243B63">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme:dark)">
<title>مخزوني — إدارة المخازن والاستهلاك</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="مخزوني — إدارة المخازن واستهلاك الورق والفيلم، عربي بالكامل، يشتغل أوفلاين">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Zain:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===================== TOKENS ===================== */
:root{
  --bg:#EDF0F5; --bg2:#E3E8F0; --surf:#FFFFFF; --surf2:#F5F7FA;
  --ink:#14203A; --ink2:#4A5875; --ink3:#8592AC;
  --line:#DCE2EC; --line2:#EAEEF4;
  --pri:#243B63; --pri-soft:#E2E9F7; --pri-ink:#FFFFFF;
  --acc:#D9822B; --acc-soft:#FCEEDC;
  --ok:#1E8A6E; --ok-soft:#DDF3EC;
  --warn:#C4791A; --warn-soft:#FBEEDA;
  --bad:#C0392F; --bad-soft:#FBE4E1;
  --info:#1F7A8C; --info-soft:#DEF0F3;

  --hero-1:#243B63; --hero-2:#16233A; --hero-line:transparent;
  --c-thermal:#0F7FA8; --c-photo:#C2255C; --c-plastic:#6D4AC7;
  --c-film:#0E7C86; --c-chem:#2F7D32; --c-ink:#B8348A; --c-misc:#B36A12;

  --r-xs:8px; --r-sm:12px; --r:16px; --r-lg:22px; --r-xl:28px; --r-full:999px;
  --sh-1:0 1px 2px rgba(20,32,58,.06), 0 1px 1px rgba(20,32,58,.04);
  --sh-2:0 4px 14px rgba(20,32,58,.08), 0 1px 3px rgba(20,32,58,.05);
  --sh-3:0 18px 42px rgba(20,32,58,.16), 0 4px 12px rgba(20,32,58,.08);
  --sh-in:inset 0 1px 0 rgba(255,255,255,.6);

  --spring:cubic-bezier(.34,1.56,.64,1);
  --spring-soft:cubic-bezier(.22,1.1,.36,1);
  --out:cubic-bezier(.16,1,.3,1);
  --in-out:cubic-bezier(.65,0,.35,1);

  --nav-h:70px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html[data-theme="dark"]{
  --bg:#0B0B0C; --bg2:#101012; --surf:#151517; --surf2:#1D1D21;
  --ink:#F6F6F8; --ink2:#B2B2BB; --ink3:#7B7B85;
  --line:#2E2E34; --line2:#232328;
  --pri:#FFFFFF; --pri-soft:#242429; --pri-ink:#0B0B0C;
  --acc:#FF9F1C; --acc-soft:#31220C;
  --ok:#2ED47A; --ok-soft:#0D2E1D;
  --warn:#FFC542; --warn-soft:#32270D;
  --bad:#FF5C5C; --bad-soft:#331414;
  --info:#37D5F2; --info-soft:#0D2E37;
  --hero-1:#1F1F24; --hero-2:#0D0D10; --hero-line:#33333A;
  --c-thermal:#38BDF8; --c-photo:#FB7185; --c-plastic:#A78BFA;
  --c-film:#2DD4BF; --c-chem:#4ADE80; --c-ink:#E879F9; --c-misc:#FBBF24;
  --sh-1:0 0 0 1px rgba(255,255,255,.055);
  --sh-2:0 6px 20px rgba(0,0,0,.7);
  --sh-3:0 20px 50px rgba(0,0,0,.85);
  --sh-in:inset 0 1px 0 rgba(255,255,255,.04);
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    --bg:#0B0B0C; --bg2:#101012; --surf:#151517; --surf2:#1D1D21;
    --ink:#F6F6F8; --ink2:#B2B2BB; --ink3:#7B7B85;
    --line:#2E2E34; --line2:#232328;
    --pri:#FFFFFF; --pri-soft:#242429; --pri-ink:#0B0B0C;
    --acc:#FF9F1C; --acc-soft:#31220C;
    --ok:#2ED47A; --ok-soft:#0D2E1D;
    --warn:#FFC542; --warn-soft:#32270D;
    --bad:#FF5C5C; --bad-soft:#331414;
    --info:#37D5F2; --info-soft:#0D2E37;
    --hero-1:#1F1F24; --hero-2:#0D0D10; --hero-line:#33333A;
    --c-thermal:#38BDF8; --c-photo:#FB7185; --c-plastic:#A78BFA;
    --c-film:#2DD4BF; --c-chem:#4ADE80; --c-ink:#E879F9; --c-misc:#FBBF24;
    --sh-1:0 0 0 1px rgba(255,255,255,.055);
    --sh-2:0 6px 20px rgba(0,0,0,.7);
    --sh-3:0 20px 50px rgba(0,0,0,.85);
    --sh-in:inset 0 1px 0 rgba(255,255,255,.04);
  }
}

/* ===================== BASE ===================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.65; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:var(--pri);text-decoration:none}
::-webkit-scrollbar{width:0;height:0}
.num{font-family:"Zain","IBM Plex Sans Arabic",sans-serif;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.dsp{font-family:"Zain","IBM Plex Sans Arabic",sans-serif;font-weight:900;letter-spacing:.3px}
.mut{color:var(--ink2)} .mut2{color:var(--ink3)}
.hide{display:none!important}

/* ===================== SHELL ===================== */
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;background:var(--bg);overflow-x:hidden}
.topbar{
  position:sticky;top:0;z-index:40;padding:calc(var(--safe-t) + 10px) 16px 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-bottom:1px solid transparent;transition:border-color .25s;
}
.topbar.stuck{border-bottom-color:var(--line)}
.topbar-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{
  width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--pri),color-mix(in srgb,var(--pri) 60%,var(--acc)));
  box-shadow:var(--sh-2);
}
.brand .mark svg{width:22px;height:22px}
.brand h1{margin:0;font-size:18px;font-family:"Zain";font-weight:900;line-height:1.1}
.brand .sub{font-size:11px;color:var(--ink3);line-height:1.1;margin-top:1px}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:var(--surf);border:1px solid var(--line);box-shadow:var(--sh-1);color:var(--ink2);
  transition:transform .3s var(--spring),background .2s,color .2s;position:relative;
}
.icon-btn:active{transform:scale(.88)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .dot{position:absolute;top:7px;inset-inline-end:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surf)}

main{padding:14px 16px calc(var(--nav-h) + var(--safe-b) + 26px)}

/* ===================== SCREEN TRANSITIONS ===================== */
.screen{display:none}
.screen.on{display:block}
/* الشاشة ثابتة — دخول رأسي خفيف بس، من غير أي تحريك يمين وشمال */
@keyframes scr-in{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.screen.on.fwd,.screen.on.bwd{animation:scr-in .26s var(--out) both}
/* حافة السحب للرجوع */
#edge{position:fixed;top:0;bottom:var(--nav-h);inset-inline-start:0;width:24px;z-index:45}
#edgeHint{position:fixed;top:50%;inset-inline-start:0;z-index:46;transform:translate(-100%,-50%);
  width:44px;height:44px;border-radius:0 22px 22px 0;background:var(--pri);color:var(--pri-ink);
  display:grid;place-items:center;box-shadow:var(--sh-2);opacity:0;pointer-events:none;transition:opacity .15s}
html[dir="rtl"] #edgeHint{border-radius:22px 0 0 22px;transform:translate(100%,-50%)}
@keyframes rise{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
.screen.on.anim > *{animation:rise .46s var(--out) both}
.screen.on.anim > *:nth-child(1){animation-delay:.02s}
.screen.on.anim > *:nth-child(2){animation-delay:.06s}
.screen.on.anim > *:nth-child(3){animation-delay:.10s}
.screen.on.anim > *:nth-child(4){animation-delay:.14s}
.screen.on.anim > *:nth-child(5){animation-delay:.18s}
.screen.on.anim > *:nth-child(6){animation-delay:.22s}
.screen.on.anim > *:nth-child(n+7){animation-delay:.26s}

/* ===================== CARDS ===================== */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1);padding:16px;margin-bottom:14px}
.card.tight{padding:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h3{margin:0;font-size:15px;font-weight:600}
.card-h .lnk{font-size:12.5px;color:var(--pri);font-weight:600}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--ink3);text-transform:uppercase}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.sec-t h2{margin:0;font-size:16px;font-weight:700}
.sec-t .lnk{font-size:12.5px;color:var(--pri);font-weight:600}

/* ===================== SIGNATURE: REAM GAUGE ===================== */
/* شريط الرصيد — يشبه رزمة ورق بتقل */
.ream{--fill:60;--tint:var(--pri);display:block;width:100%}
.ream-bars{display:flex;gap:2.5px;height:34px;align-items:flex-end}
.ream-bars i{
  flex:1;display:block;border-radius:2px 2px 1px 1px;background:var(--line);
  height:38%;transform-origin:bottom;
}
.ream-bars i.f{background:var(--tint);box-shadow:0 0 0 .5px color-mix(in srgb,var(--tint) 45%,transparent)}
@keyframes reamup{from{transform:scaleY(.05);opacity:.2}to{transform:scaleY(1);opacity:1}}
.ream-bars i{animation:reamup .5s var(--spring-soft) both}
.ream-legend{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--ink3)}

/* ===================== HERO / COVERAGE ===================== */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-xl);padding:18px 18px 16px;margin-bottom:14px;
  background:linear-gradient(155deg,var(--hero-1) 0%,var(--hero-2) 100%);
  border:1px solid var(--hero-line);color:#fff;box-shadow:var(--sh-2);
}
.hero::after{
  content:"";position:absolute;inset-inline-end:-40px;top:-60px;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--acc) 55%,transparent),transparent 68%);pointer-events:none;
}
.hero .lbl{font-size:12px;opacity:.75;display:flex;align-items:center;gap:6px}
.hero .big{font-size:44px;line-height:1.05;margin:4px 0 2px}
.hero .unit{font-size:15px;opacity:.8;font-weight:400;margin-inline-start:6px}
.hero .note{font-size:12.5px;opacity:.82}
.hero-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px;position:relative}
.hero{position:relative}
.hero-ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.hero-ring .trk{fill:none;stroke:rgba(255,255,255,.14);stroke-width:3}
.hero-ring .bar{fill:none;stroke-width:3.5;stroke-linecap:round;
  stroke-dasharray:var(--len);stroke-dashoffset:var(--len);
  animation:ringfill 1.25s var(--out) .15s forwards;
  filter:drop-shadow(0 0 5px currentColor)}
@keyframes ringfill{to{stroke-dashoffset:var(--off)}}
.hero-cap{display:flex;align-items:center;gap:7px;margin-top:13px;position:relative;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);
  border-radius:14px;padding:9px 12px;font-size:12.5px;line-height:1.5}
.hero-cap .dot{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.hero-cap b{font-weight:700}
.hero-grid > div{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:9px 10px}
.hero-grid .k{font-size:10.5px;opacity:.75;line-height:1.3}
.hero-grid .v{font-size:19px;line-height:1.2;margin-top:2px}

/* ===================== QUICK TILES ===================== */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:14px}
.tile{
  --tint:var(--pri);background:var(--surf);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--sh-1);
  transition:transform .32s var(--spring),box-shadow .25s;
}
.tile:active{transform:scale(.93);box-shadow:none}
.tile .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--tint) 14%,transparent);color:var(--tint)}
.tile .ic svg{width:19px;height:19px}
.tile span{font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.2;text-align:center}

/* ===================== LISTS / ROWS ===================== */
.rows{display:flex;flex-direction:column}
.row{
  display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line2);
  transition:transform .3s var(--spring);
}
.row:last-child{border-bottom:0}
.row:active{transform:scale(.985)}
.row .ic{--tint:var(--pri);width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--tint) 13%,transparent);color:var(--tint)}
.row .ic svg{width:19px;height:19px}
.row .mid{flex:1;min-width:0}
.row .t{font-size:14px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:11.5px;color:var(--ink3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:end;flex:none}
.row .end .v{font-size:16px;line-height:1.2}
.row .end .u{font-size:11px;color:var(--ink3)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:var(--r-full);background:var(--surf2);color:var(--ink2);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.acc{background:var(--acc-soft);color:var(--acc);border-color:transparent}

/* ===================== BARS ===================== */
.bar{height:7px;border-radius:var(--r-full);background:var(--line2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--pri);transform-origin:right;animation:barin .7s var(--out) both}
@keyframes barin{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ===================== EMPTY ===================== */
.empty{text-align:center;padding:36px 20px;color:var(--ink3)}
.empty .ic{width:64px;height:64px;border-radius:22px;margin:0 auto 12px;display:grid;place-items:center;background:var(--surf2);color:var(--ink3)}
.empty .ic svg{width:28px;height:28px}
.empty h4{margin:0 0 4px;font-size:15px;color:var(--ink2);font-weight:600}
.empty p{margin:0 0 14px;font-size:13px}

/* ===================== BUTTONS ===================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;
  background:var(--pri);color:var(--pri-ink);box-shadow:var(--sh-1);
  transition:transform .3s var(--spring),opacity .2s;
}
.btn:active{transform:scale(.94)}
.btn svg{width:17px;height:17px}
.btn.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--pri-soft);color:var(--pri);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.wide{width:100%}
.btn.sm{padding:8px 13px;font-size:12.5px;border-radius:11px}
.btn:disabled{opacity:.45}
.btn-row{display:flex;gap:9px}
.btn-row > *{flex:1}

.fab{
  position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);inset-inline-end:max(16px,calc(50vw - 260px + 16px));
  width:56px;height:56px;border-radius:20px;display:grid;place-items:center;z-index:35;
  background:var(--acc);color:#1A1206;box-shadow:0 10px 26px color-mix(in srgb,var(--acc) 45%,transparent);
  transition:transform .35s var(--spring);
}
.fab:active{transform:scale(.88) rotate(90deg)}
.fab svg{width:25px;height:25px}

/* ===================== SEGMENTS / FILTERS ===================== */
.seg{display:flex;gap:4px;background:var(--surf2);border:1px solid var(--line);padding:4px;border-radius:15px;margin-bottom:12px}
.seg button{flex:1;padding:8px 6px;border-radius:11px;font-size:12.5px;font-weight:600;color:var(--ink2);transition:all .28s var(--spring-soft)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:var(--sh-1)}
.scroller{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;margin:0 -16px 8px;padding-inline:16px;scroll-snap-type:x proximity}
.scroller::-webkit-scrollbar{display:none}
.pill{flex:none;padding:7px 13px;border-radius:var(--r-full);font-size:12.5px;font-weight:600;background:var(--surf);border:1px solid var(--line);color:var(--ink2);transition:all .28s var(--spring-soft);scroll-snap-align:start}
.pill.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.pill:active{transform:scale(.93)}

/* ===================== SEARCH ===================== */
.search{display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--line);border-radius:15px;padding:10px 13px;margin-bottom:12px;box-shadow:var(--sh-1)}
.search svg{width:17px;height:17px;color:var(--ink3);flex:none}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:14px;min-width:0}

/* ===================== FORMS ===================== */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:var(--surf2);
  outline:0;transition:border-color .2s,background .2s,box-shadow .2s;font-size:15px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pri);background:var(--surf);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 15%,transparent)}
.field textarea{resize:vertical;min-height:70px;font-size:14px;line-height:1.6}
.field .hint{font-size:11.5px;color:var(--ink3);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.picks{display:flex;flex-wrap:wrap;gap:7px}
.pick{padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surf2);font-size:13px;font-weight:600;color:var(--ink2);transition:all .28s var(--spring-soft)}
.pick.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.pick:active{transform:scale(.93)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{min-width:42px;padding:0 10px;height:42px;border-radius:13px;background:var(--surf2);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--ink2);transition:transform .3s var(--spring)}
.stepper button:active{transform:scale(.88)}
.stepper button.stp{font-family:"Zain";font-size:16px;letter-spacing:0}
.stepper button.stp.plus{background:var(--pri-soft);color:var(--pri);border-color:transparent}
.stepper input{flex:1;text-align:center;font-family:"Zain";font-weight:800;font-size:22px}
.switch{width:48px;height:29px;border-radius:var(--r-full);background:var(--line);position:relative;transition:background .3s var(--in-out);flex:none}
.switch i{position:absolute;top:3px;inset-inline-start:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);transition:transform .35s var(--spring)}
.switch.on{background:var(--ok)}
.switch.on i{transform:translateX(-19px)}
html[dir="rtl"] .switch.on i{transform:translateX(-19px)}

/* ===================== ATTACHMENTS ===================== */
.att-add{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;
  border:1.5px dashed var(--line);border-radius:15px;background:var(--surf2);color:var(--ink2);
  font-size:13.5px;font-weight:600;transition:all .3s var(--spring);
}
.att-add:active{transform:scale(.96);border-color:var(--pri)}
.att-add svg{width:18px;height:18px}
.att{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid var(--line);border-radius:15px;background:var(--surf2);animation:pop .45s var(--spring) both}
.att .thumb{width:52px;height:52px;border-radius:12px;flex:none;overflow:hidden;background:var(--surf);display:grid;place-items:center;color:var(--ink3)}
.att .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.att .meta{flex:1;min-width:0}
.att .meta b{display:block;font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.att .meta span{font-size:11px;color:var(--ink3)}
.att .rm{width:32px;height:32px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--bad-soft);color:var(--bad);transition:transform .3s var(--spring)}
.att .rm:active{transform:scale(.85)}
/* لوجو المركز */
.logo{border-radius:14px;flex:none;display:grid;place-items:center;overflow:hidden;
  background:var(--surf2);border:1px solid var(--line);font-family:"Zain";font-weight:900;color:#fff}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo-pick{width:82px;height:82px;border-radius:22px;margin:0 auto 6px;display:grid;place-items:center;
  overflow:hidden;background:var(--surf2);border:1.5px dashed var(--line);color:var(--ink3);
  transition:transform .3s var(--spring),border-color .2s}
.logo-pick:active{transform:scale(.94)}
.logo-pick.has{border-style:solid;border-color:transparent}
.logo-pick.busy{position:relative}
.logo-pick.busy::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.45)}
.logo-pick.busy::before{content:"";position:absolute;z-index:2;width:22px;height:22px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
.logo-pick img{width:100%;height:100%;object-fit:cover;display:block}

/* إشارة المرور — اتسلّم / باقي / الإجمالي */
.tl{display:flex;gap:7px;margin-top:11px}
.tl > div{flex:1;border-radius:14px;padding:8px 6px 7px;text-align:center;position:relative;overflow:hidden;
  border:1px solid transparent;background:var(--surf2)}
.tl .n{font-family:"Zain";font-weight:900;font-size:18px;line-height:1.15;font-variant-numeric:tabular-nums}
.tl .w{font-size:10.5px;font-weight:600;margin-top:1px;opacity:.9}
.tl .lamp{position:absolute;top:6px;inset-inline-start:6px;width:7px;height:7px;border-radius:50%;opacity:.9}
.tl .g{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.tl .g .lamp{background:var(--ok)}
.tl .a{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.tl .a .lamp{background:var(--warn)}
.tl .r{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 32%,transparent)}
.tl .r .lamp{background:var(--bad)}
.tl .n0{background:var(--surf2);color:var(--ink2);border-color:var(--line)}
.tl .n0 .lamp{background:var(--ink3)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.28}}
.tl .blink .lamp{animation:blink 1.15s ease-in-out infinite}
.tl .blink .n{animation:blink 1.15s ease-in-out infinite}
.ans{margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);animation:rise .35s var(--out) both}
.ans-t{font-family:"Zain";font-weight:900;font-size:19px;line-height:1.3;margin-bottom:5px}
.ans-d{font-size:13px;line-height:1.9;color:var(--ink2)}
.rm-btn{width:32px;height:32px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--bad-soft);color:var(--bad);margin-inline-start:6px;transition:transform .3s var(--spring)}
.rm-btn:active{transform:scale(.85)}
.att-view{width:100%;border-radius:14px;display:block;margin-top:10px;border:1px solid var(--line)}
.clip-i{display:inline-flex;vertical-align:-2px;margin-inline-start:4px;opacity:.75}
.clip-i svg{width:12px;height:12px}

/* ===================== SHEET ===================== */
.scrim{position:fixed;inset:0;background:rgba(8,14,26,.5);backdrop-filter:blur(3px);z-index:60;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;inset-inline:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;
  background:var(--surf);border-radius:26px 26px 0 0;box-shadow:var(--sh-3);
  transform:translateY(102%);transition:transform .42s var(--spring-soft);
  max-height:92vh;display:flex;flex-direction:column;
}
.sheet.on{transform:translateY(0)}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px;flex:none;touch-action:none}
.sheet-h{touch-action:none}
.sheet-x{touch-action:manipulation}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 18px 10px;flex:none}
.sheet-h h3{margin:0;font-size:17px;font-weight:700}
.sheet-b{padding:4px 18px calc(20px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-x{width:32px;height:32px;border-radius:11px;background:var(--surf2);display:grid;place-items:center;color:var(--ink2);flex:none;transition:transform .3s var(--spring)}
.sheet-x:active{transform:scale(.86)}
.sheet-x svg{width:16px;height:16px}

/* ===================== NAV ===================== */
.nav{
  position:fixed;bottom:0;inset-inline:0;z-index:50;max-width:520px;margin:0 auto;
  height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:color-mix(in srgb,var(--surf) 88%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);display:flex;
}
.nav button{
  flex:1;min-width:0;padding:0 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--ink3);position:relative;transition:color .25s;
}
.nav button .ic{position:relative;transition:transform .4s var(--spring)}
.nav button svg{width:21px;height:21px}
.nav button span{font-size:9px;font-weight:600;letter-spacing:-.2px;line-height:1.15;text-align:center;white-space:normal;padding:0 2px}
.nav button.on{color:var(--pri)}
.nav button.on .ic{transform:translateY(-2px) scale(1.08)}
.nav button:active .ic{transform:scale(.86)}
.nav .badge{
  position:absolute;top:-4px;inset-inline-end:-8px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;
}

/* ===================== TOAST ===================== */
/* مؤشّر الاتصال — أيقونة صغيرة جنب الإشعارات */
.icon-btn.net{position:relative}
.icon-btn.net .st{
  position:absolute;bottom:5px;inset-inline-end:5px;width:9px;height:9px;border-radius:50%;
  border:2px solid var(--surf);background:var(--ink3);transition:background .3s;
}
.icon-btn.net.on-line .st{background:var(--ok)}
.icon-btn.net.off-line .st{background:var(--ink3)}
.icon-btn.net.pending .st{background:var(--warn)}
.icon-btn.net.busy .st{background:var(--pri)}
@keyframes pulse-dot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.55}}
.icon-btn.net.busy .st{animation:pulse-dot 1s ease-in-out infinite}
#toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 20px);inset-inline:0;z-index:80;display:flex;justify-content:center;pointer-events:none}
#toast div{
  background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:var(--r-full);font-size:13.5px;font-weight:600;
  box-shadow:var(--sh-3);transform:translateY(24px);opacity:0;transition:all .4s var(--spring);max-width:88%;
}
#toast div.on{transform:none;opacity:1}

/* ===================== CHARTS ===================== */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line2);stroke-width:1}
.chart .ln{fill:none;stroke:var(--pri);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .ar{fill:url(#gfill);opacity:.9}
.chart .pt{fill:var(--surf);stroke:var(--pri);stroke-width:2.5}
.chart text{font-size:10px;fill:var(--ink3);font-family:"IBM Plex Sans Arabic"}
@keyframes draw{to{stroke-dashoffset:0}}
.chart .ln.anim{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s var(--out) forwards}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart .bar-g{transform-origin:bottom;animation:grow .6s var(--spring-soft) both}
@keyframes fadein{to{opacity:1}}
.chart .fade{opacity:0;animation:fadein .5s ease .6s forwards}

/* ===================== LOCK ===================== */
#lock{display:none!important}
#auth{position:fixed;inset:0;z-index:95;background:var(--bg);display:none;overflow-y:auto}
#auth.on{display:block}
.auth-box{max-width:400px;margin:0 auto;padding:calc(var(--safe-t) + 44px) 22px 40px;min-height:100%;display:flex;flex-direction:column;justify-content:center}
.auth-crest{width:74px;height:74px;border-radius:24px;margin:0 auto 16px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--hero-1),var(--hero-2));box-shadow:var(--sh-2);animation:pop .6s var(--spring) both}
.auth-title{text-align:center;margin-bottom:22px}
.auth-title h2{margin:0;font-family:"Zain";font-weight:900;font-size:25px}
.auth-title p{margin:4px 0 0;font-size:13px;color:var(--ink2)}
.who{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-full);padding:4px 11px 4px 4px;box-shadow:var(--sh-1);flex:none;transition:transform .3s var(--spring)}
.who:active{transform:scale(.93)}
.who .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:"Zain";font-weight:900;font-size:13px;color:#fff;flex:none}
.who .nm{font-size:12px;font-weight:600;max-width:76px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pin-dots{display:flex;gap:13px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pri);transition:all .25s var(--spring)}
.pin-dots i.f{background:var(--pri);transform:scale(1.15)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;width:100%;max-width:280px}
.keypad button{height:62px;border-radius:20px;background:var(--surf);border:1px solid var(--line);font-family:"Zain";font-weight:800;font-size:25px;box-shadow:var(--sh-1);transition:transform .25s var(--spring)}
.keypad button:active{transform:scale(.9);background:var(--pri-soft)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.shake{animation:shake .5s}


/* ===================== MOTION EXTRAS ===================== */
@keyframes pop{0%{transform:scale(.55);opacity:0}62%{transform:scale(1.07);opacity:1}100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ringdraw{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--o)}}
@keyframes hbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sheen{0%{transform:translateX(-120%)}55%,100%{transform:translateX(240%)}}
@keyframes tick{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes popin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.pop{animation:pop .5s var(--spring) both}
.floaty{animation:floaty 3.4s ease-in-out infinite}
.tickin{display:inline-grid;place-items:center;animation:tick .55s var(--spring) both}

.hb{margin-bottom:13px}
.hb-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.hb-top .l{font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hb-track{height:11px;border-radius:var(--r-full);background:var(--surf2);overflow:hidden;border:1px solid var(--line2)}
.hb-fill{height:100%;border-radius:inherit;transform-origin:right;animation:hbar .85s var(--out) both;position:relative;overflow:hidden}
.hb-fill::after{content:"";position:absolute;inset:0;width:38%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:sheen 2.8s ease-in-out .8s infinite}

.dep{position:relative;height:16px;border-radius:var(--r-full);background:var(--surf2);overflow:hidden;border:1px solid var(--line)}
.dep i{position:absolute;inset:0;transform-origin:right;border-radius:inherit;animation:hbar .9s var(--out) both}
.dep i::after{content:"";position:absolute;inset:0;width:34%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);animation:sheen 3s ease-in-out 1s infinite}
.dep b{position:absolute;top:0;bottom:0;width:1.5px;background:var(--bg);opacity:.5}

.donut-wrap{display:flex;align-items:center;gap:16px}
.donut{flex:none;animation:popin .6s var(--out) both}
.donut circle{fill:none;stroke-linecap:butt;transform:rotate(-90deg);transform-origin:50% 50%;animation:seg .95s var(--out) both}
@keyframes seg{from{stroke-dasharray:0 var(--C)}to{stroke-dasharray:var(--L) var(--C)}}
.lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.lg-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.lg-row i{width:10px;height:10px;border-radius:3px;flex:none}
.lg-row .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lg-row .n{margin-inline-start:auto;font-size:12.5px;flex:none}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{--tint:var(--pri);background:var(--surf);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 14px;position:relative;overflow:hidden;box-shadow:var(--sh-1);transition:transform .3s var(--spring)}
.stat:active{transform:scale(.96)}
.stat::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--tint)}
.stat .k{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.stat .k svg{width:13px;height:13px;color:var(--tint);flex:none}
.stat .v{font-size:24px;line-height:1.15;margin-top:3px;color:var(--tint)}
.stat .s{font-size:11px;color:var(--ink3);margin-top:1px}

.spark{display:block;width:100%;height:auto}
@keyframes spin{to{transform:rotate(-360deg)}}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div id="app">

  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.6 9.6 12 4.2l9.4 5.4"/>
            <path d="M4.4 10.7V20h15.2v-9.3"/>
            <path d="M2.6 20h18.8"/>
            <rect x="8.4" y="13.2" width="7.2" height="6.8" rx="1"/>
            <path d="M8.4 16.6h7.2M12 13.2V20"/>
          </svg>
        </div>
        <div>
          <h1 id="brandName">مخزوني</h1>
          <div class="sub" id="brandSub">إدارة المخزن والاستهلاك</div>
        </div>
      </div>
      <div style="flex:1"></div>
      <button class="who hide" id="whoBox" aria-label="المستخدم"></button>
      <button class="icon-btn net" id="btnNet" aria-label="حالة الاتصال">
        <span id="netIc"></span><i class="st"></i>
      </button>
      <button class="icon-btn" id="btnAlerts" aria-label="التنبيهات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 1 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <i class="dot hide" id="alertDot"></i>
      </button>
      <button class="icon-btn" id="btnTheme" aria-label="المظهر">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="screen" id="s-home"></section>
    <section class="screen" id="s-stock"></section>
    <section class="screen" id="s-centers"></section>
    <section class="screen" id="s-moves"></section>
    <section class="screen" id="s-reports"></section>
    <section class="screen" id="s-more"></section>
  </main>

  <button class="fab" id="fab" aria-label="حركة جديدة">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="nav" id="nav">
    <button data-scr="home" class="on">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span>
      <span>الرئيسية</span>
    </button>
    <button data-scr="stock">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 12 4l9 4.5-9 4.5-9-4.5Z"/><path d="M3 12.5 12 17l9-4.5"/><path d="M3 16.5 12 21l9-4.5"/></svg><i class="badge hide" id="badgeStock">0</i></span>
      <span>المخزون</span>
    </button>
    <button data-scr="centers">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l6-4 6 4v12"/><path d="M15 21V13h6v8"/><path d="M7 12h1M7 16h1M11 12h1M11 16h1"/></svg><i class="badge hide" id="badgeCenters">0</i></span>
      <span>طلبيات المراكز</span>
    </button>
    <button data-scr="moves">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v13M7 4 3.5 7.5M7 4l3.5 3.5"/><path d="M17 20V7M17 20l3.5-3.5M17 20l-3.5-3.5"/></svg></span>
      <span>الحركات</span>
    </button>
    <button data-scr="reports">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>
      <span>التقارير</span>
    </button>
    <button data-scr="more">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="6" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg></span>
      <span>المزيد</span>
    </button>
  </nav>
</div>

<div id="edge"></div><div id="edgeHint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M15 5 8 12l7 7"/></svg></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-grip"></div>
  <div class="sheet-h"><h3 id="sheetTitle"></h3><button class="sheet-x" id="sheetX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="sheet-b" id="sheetBody"></div>
</div>

<div id="toast"><div id="toastMsg"></div></div>

<div id="auth"><div class="auth-box" id="authBox"></div></div>
<div id="lock" class="hide">

/* نص مساعد: 1200 ورقة = 2 علبة */
function packTxt(it, q){
  if (!isSheet(it) || !q) return "";
  const p = q / it.pack;
  return ` · ${n1(p)} علبة`;
}
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms||12); }catch(e){} }

  const el = $("#toastMsg"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 2100);
}
function countUp(el, to, fmt){
  const t0 = performance.now(), dur = 750, from = 0, final = el.innerHTML;
  function tick(t){
    const p = Math.min(1,(t-t0)/dur), e = 1 - Math.pow(1-p,3);
    el.textContent = fmt(from + (to-from)*e);
    if (p < 1) requestAnimationFrame(tick); else el.innerHTML = final;
  }
  requestAnimationFrame(tick);
}

/* =========================================================
   منطق المخزون
   ========================================================= */

/* أثر الحركة على مخزن معين */
function effect(m, storeId){
  const t = MOVES[m.type]; if (!t) return 0;
  if (m.type === "move"){
    if (storeId == null) return 0;
    if (m.storeId === storeId) return -m.qty;
    if (m.toStoreId === storeId) return +m.qty;
    return 0;
  }
  if (m.type === "adjust"){
    if (storeId != null && m.storeId !== storeId) return 0;
    return m.delta || 0;
  }
  if (storeId != null && m.storeId !== storeId) return 0;
  return t.sign * m.qty;
}

/* رصيد صنف (كل المخازن أو مخزن معين) حتى تاريخ */
function balance(itemId, storeId, upto){
  let b = 0;
  for (const m of S.moves){
    if (m.itemId !== itemId) continue;
    if (upto && m.date > upto) continue;
    b += effect(m, storeId);
  }
  return b;
}
function balancesByStore(itemId){
  const out = {};
  for (const s of S.stores) out[s.id] = balance(itemId, s.id);
  return out;
}

/* الاستهلاك (منصرف + هالك) خلال فترة */
function consumedBetween(itemId, from, to){
  let q = 0;
  for (const m of S.moves){
    if (itemId && m.itemId !== itemId) continue;
    if (m.date < from || m.date > to) continue;
    if (m.type === "out" || m.type === "damage") q += m.qty;
  }
  return q;
}
function receivedBetween(itemId, from, to){
  let q = 0;
  for (const m of S.moves){
    if (itemId && m.itemId !== itemId) continue;
    if (m.date < from || m.date > to) continue;
    if (m.type === "in") q += m.qty;
  }
  return q;
}

/* متوسط الاستهلاك اليومي — على أساس نافذة الأيام أو من أول حركة */
function avgDaily(itemId){
  const win = S.cfg.avgWindow || 30;
  const to = todayISO(), from = addDays(to, -(win-1));
  const first = firstMoveDate(itemId);
  let days = win;
  if (first && first > from) days = Math.max(1, daysBetween(first, to) + 1);
  const q = consumedBetween(itemId, from, to);
  return q / days;
}
function firstMoveDate(itemId){
  let f = null;
  for (const m of S.moves){ if (itemId && m.itemId !== itemId) continue; if (!f || m.date < f) f = m.date; }
  return f;
}
/* أيام التغطية */
function coverage(itemId){
  const b = balance(itemId), a = avgDaily(itemId);
  if (b <= 0) return 0;
  if (a <= 0) return Infinity;
  return b / a;
}
function covState(d){
  if (d === Infinity) return "idle";
  if (d <= (S.cfg.covBad||7)) return "bad";
  if (d <= (S.cfg.covWarn||14)) return "warn";
  return "ok";
}
const COV_LBL = { bad:"خطر — قرّب يخلص", warn:"محتاج طلبية", ok:"الرصيد مريح", idle:"مفيش استهلاك مسجّل" };

/* قيمة المخزون */
function stockValue(){
  let v = 0;
  for (const it of S.items) v += balance(it.id) * (it.cost || 0);
  return v;
}

/* التنبيهات */
function alerts(){
  const A = [], t = todayISO();
  for (const it of S.items){
    if (it.archived) continue;
    const b = balance(it.id);
    if (b < 0){
      A.push({ id:"neg-"+it.id, sev:3, ic:"warn", tint:"var(--bad)", t:`رصيد سالب — ${it.name}`, d:`الرصيد ${n1(b)} ${it.unit}. راجع الحركات أو اعمل تسوية جرد.`, go:()=>openItem(it.id) });
      continue;
    }
    if (b === 0 && S.moves.some(m => m.itemId === it.id)){
      A.push({ id:"zero-"+it.id, sev:3, ic:"warn", tint:"var(--bad)", t:`خلص خالص — ${it.name}`, d:`الرصيد صفر في كل المخازن.`, go:()=>openItem(it.id) });
      continue;
    }
    if (it.min && b > 0 && b <= it.min){
      A.push({ id:"min-"+it.id, sev:2, ic:"down", tint:"var(--warn)", t:`تحت حد الطلب — ${it.name}`, d:`الرصيد ${n1(b)} والحد الأدنى ${n1(it.min)} ${it.unit}.`, go:()=>openItem(it.id) });
    }
    const cv = coverage(it.id), st = covState(cv);
    if (b > 0 && (st === "bad" || st === "warn")){
      A.push({ id:"cov-"+it.id, sev: st==="bad"?2:1, ic:"clock", tint: st==="bad"?"var(--bad)":"var(--warn)",
        t:`${it.name} يكفي ${n0(cv)} يوم`, d:`متوسط الاستهلاك ${n1(avgDaily(it.id))} ${it.unit}/يوم — اطلب قبل ${fDate(addDays(t, Math.max(0,Math.floor(cv))))}`, go:()=>openItem(it.id) });
    }
    if (it.exp){
      const left = daysBetween(t, it.exp);
      if (left < 0) A.push({ id:"exp-"+it.id, sev:3, ic:"warn", tint:"var(--bad)", t:`منتهي الصلاحية — ${it.name}`, d:`انتهت من ${n0(-left)} يوم (${fDate(it.exp)})`, go:()=>openItem(it.id) });
      else if (left <= 60 && b > 0) A.push({ id:"exps-"+it.id, sev:2, ic:"clock", tint:"var(--warn)", t:`الصلاحية قربت — ${it.name}`, d:`باقي ${n0(left)} يوم (${fDate(it.exp)}) والرصيد ${n1(b)} ${it.unit}`, go:()=>openItem(it.id) });
    }
  }
  /* قفزة استهلاك */
  const w = 7;
  const cThis = consumedBetween(null, addDays(t,-(w-1)), t);
  const cPrev = consumedBetween(null, addDays(t,-(2*w-1)), addDays(t,-w));
  if (cPrev > 0 && cThis > cPrev * 1.6){
    A.push({ id:"spike", sev:1, ic:"up", tint:"var(--acc)", t:"الاستهلاك زاد الأسبوع ده", d:`${n1(cThis)} مقابل ${n1(cPrev)} الأسبوع اللي فات (+${n0((cThis/cPrev-1)*100)}%)`, go:()=>go("reports") });
  }
  if (!S.items.length){
    A.push({ id:"noitems", sev:1, ic:"box", tint:"var(--pri)", t:"ابدأ بإضافة الأصناف", d:"ضيف الورق والفيلم اللي بتتعامل بيه عشان نبدأ نحسب الرصيد.", go:()=>openItemForm() });
  }
  return A.sort((a,b) => b.sev - a.sev);
}

/* سلسلة يومية للاستهلاك */
function dailySeries(days, itemId, kind){
  const t = todayISO(), out = [];
  for (let i = days-1; i >= 0; i--){
    const d = addDays(t, -i);
    let q = 0;
    for (const m of S.moves){
      if (m.date !== d) continue;
      if (itemId && m.itemId !== itemId) continue;
      if (kind === "in" && m.type === "in") q += m.qty;
      else if (kind !== "in" && (m.type === "out" || m.type === "damage")) q += m.qty;
    }
    out.push({ d, v:q });
  }
  return out;
}

/* =========================================================
   التنقّل بين الشاشات
   ========================================================= */
let NAVHIST = [];
function go(scr, back){
  if (scr === SCR) return;
  if (back) NAVHIST.pop();
  else { NAVHIST.push(SCR); if (NAVHIST.length > 12) NAVHIST.shift(); }
  const dir = back ? "bwd" : "fwd";
  SCR = scr;
  $$(".screen").forEach(el => el.classList.remove("on","fwd","bwd","anim"));
  $$("#nav button").forEach(b => b.classList.toggle("on", b.dataset.scr === scr));
  render();
  const el = $("#s-" + scr);
  el.classList.add("on", dir, "anim");
  window.scrollTo({ top:0, behavior:"instant" });
  setTimeout(() => el.classList.remove("anim"), 900);
}
/* رجوع: يقفل الشيت الأول، وبعدين يرجّع شاشة */
function goBack(){
  if ($("#sheet").classList.contains("on")){ closeSheet(); return true; }
  if (NAVHIST.length){ go(NAVHIST[NAVHIST.length-1], true); return true; }
  if (SCR !== "home"){ go("home", true); return true; }
  return false;
}
function render(){
  ({ home:renderHome, stock:renderStock, centers:renderCenters, moves:renderMoves, reports:renderReports, more:renderMore }[SCR] || renderHome)();
  refreshBadges();
}
function refreshBadges(){
  const A = alerts(), crit = A.filter(a => a.sev >= 2).length;
  $("#alertDot").classList.toggle("hide", A.length === 0);
  const b = $("#badgeStock");
  b.textContent = n0(crit); b.classList.toggle("hide", crit === 0);
  const openDeals = S.deals.filter(d => dealRemaining(d) > 0).length;
  const bc = $("#badgeCenters");
  bc.textContent = n0(openDeals); bc.classList.toggle("hide", openDeals === 0);
  $("#brandName").textContent = S.cfg.biz || "مخزوني";
  $("#brandSub").textContent = S.cfg.sub || "إدارة المخزن والاستهلاك";
  const mk = $(".brand .mark");
  if (mk){
    if (S.cfg.logo && mk.dataset.logo !== S.cfg.logo){
      mk.dataset.logo = S.cfg.logo;
      mk.style.background = "none";
      mk.innerHTML = `<img src="${S.cfg.logo}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`;
    } else if (!S.cfg.logo && mk.dataset.logo){
      mk.dataset.logo = "";
      mk.style.background = "";
      mk.innerHTML = BRAND_SVG;
    }
  }
}

/* =========================================================
   الرئيسية
   ========================================================= */
/* =========================================================
   رسوم إضافية: دونات + شريط أفقي + شريط الاستنفاد
   ========================================================= */
function donut(segs, opt){
  opt = opt || {};
  const R = opt.r || 46, SW = opt.sw || 17, SZ = (R + SW/2 + 2) * 2, C = 2 * Math.PI * R;
  const tot = segs.reduce((a,x) => a + x.v, 0);
  if (!tot) return "";
  let acc = 0;
  const rings = segs.map((x,k) => {
    const L = (x.v / tot) * C, off = -acc; acc += L;
    return `<circle cx="${SZ/2}" cy="${SZ/2}" r="${R}" stroke="${x.c}" stroke-width="${SW}"
      style="--C:${C.toFixed(1)};--L:${L.toFixed(1)};stroke-dasharray:${L.toFixed(1)} ${C.toFixed(1)};stroke-dashoffset:${off.toFixed(1)};animation-delay:${k*90}ms"/>`;
  }).join("");
  return `<svg class="donut" width="${SZ}" height="${SZ}" viewBox="0 0 ${SZ} ${SZ}">
    <circle cx="${SZ/2}" cy="${SZ/2}" r="${R}" stroke="var(--line2)" stroke-width="${SW}" style="animation:none;stroke-dasharray:none"/>
    ${rings}
    ${opt.mid ? `<text x="${SZ/2}" y="${SZ/2-2}" text-anchor="middle" style="font-family:Zain;font-weight:900;font-size:20px;fill:var(--ink)">${opt.mid}</text>
      <text x="${SZ/2}" y="${SZ/2+14}" text-anchor="middle" style="font-size:9.5px;fill:var(--ink3)">${opt.midSub||""}</text>` : ""}
  </svg>`;
}
function hbar(label, val, max, tint, right){
  const pct = max > 0 ? Math.max(3, Math.min(100, (val/max)*100)) : 3;
  return `<div class="hb">
    <div class="hb-top"><span class="l">${label}</span><span class="num" style="color:${tint}">${right}</span></div>
    <div class="hb-track"><div class="hb-fill" style="width:${pct.toFixed(1)}%;background:${tint}"></div></div>
  </div>`;
}
function depBar(remain, total, tint){
  const pct = total > 0 ? Math.max(0, Math.min(100, (remain/total)*100)) : 0;
  const done = remain <= 0;
  const ticks = total > 0 ? Array.from({length:3},(_,k) => `<b style="inset-inline-start:${(k+1)*25}%"></b>`).join("") : "";
  return `<div class="dep ${done?"done":""}"><i style="width:${pct.toFixed(1)}%;background:${done?"var(--ok)":tint}"></i>${ticks}</div>`;
}

/* =========================================================
   طلبيات المراكز (كمية مدفوعة بتقل مع كل تسليم)
   ========================================================= */
function dealDelivered(id){
  return S.moves.filter(m => m.dealId === id && m.type === "out").reduce((a,m) => a + m.qty, 0);
}
function dealRemaining(d){ return Math.max(0, d.qty - dealDelivered(d.id)); }
function partyDeals(pid){ return S.deals.filter(d => d.partyId === pid); }
function partyStats(pid){
  const ds = partyDeals(pid);
  const qty = ds.reduce((a,d) => a + d.qty, 0);
  const del = ds.reduce((a,d) => a + dealDelivered(d.id), 0);
  const paid = ds.reduce((a,d) => a + (d.paid || 0), 0);
  const value = ds.reduce((a,d) => a + d.qty * (d.price||0), 0);
  return { ds, qty, del, rem: Math.max(0, qty-del), paid, value, open: ds.filter(d => dealRemaining(d) > 0).length };
}
function centers(){ return S.parties.filter(p => p.kind !== "sup"); }

function renderHome(){

      <div class="big dsp">${n0(live.length)}<span class="unit">صنف</span></div>
      <div class="note">سجّل أول عملية صرف عشان نحسب معدل الاستهلاك وأيام التغطية.</div>
      ${heroGrid(val, belowMin, monthOut)}
    </div>`;
  } else {
    const st = covState(risky.cv);
    const ringTint = st === "bad" ? "#FF8A80" : st === "warn" ? "#FFD16B" : "#5BE3A7";
    const days = Math.floor(risky.cv);
    const runOut = addDays(t, days);
    const ro = new Date(runOut + "T00:00:00");
    const lead = risky.it.lead || 0;
    const orderBy = lead ? addDays(runOut, -lead) : "";
    hero = `<div class="hero">
      ${heroRing(fillPct(), ringTint)}
      <div class="lbl">${svg("clock",14)} <span>أول صنف هيخلص</span></div>
      <div class="big dsp">${n0(ro.getDate())} ${AR_MON[ro.getMonth()]}<span class="unit">${days<=0?"دلوقتي":days===1?"بكرة":`بعد ${n0(days)} يوم`}</span></div>
      <div class="note">${esc(risky.it.name)} — فاضل ${n1(risky.b)} ${esc(risky.it.unit)} وبتصرف ${n1(risky.a)} في اليوم${orderBy && days>0 ? ` · اطلب قبل ${fDate(orderBy)}` : ""}</div>
      ${heroGrid(val, belowMin, monthOut)}
    </div>`;
  }

  const tiles = `<div class="tiles">
    ${tile("in","استلام","var(--ok)")}
    ${tile("out","صرف","var(--acc)")}
    ${tile("move","تحويل","var(--c-plastic)")}
    ${tile("adjust","جرد","var(--info)")}
  </div>`;

  /* أربع بطاقات إحصائية ملوّنة */
  const stats = `<div class="stat-grid">
    ${stat("calc","قيمة المخزون",money(val),`${n0(live.length)} صنف نشط`,"var(--c-thermal)","go('stock')")}
    ${stat("out","استهلاك النهاردة",n1(todayOut),`الشهر ${n1(monthOut)}`,"var(--acc)","go('moves')")}
    ${stat("in","وارد ٣٠ يوم",n1(monthIn),`الصافي ${monthIn-monthOut>=0?"+":""}${n1(monthIn-monthOut)}`,"var(--ok)","go('moves')")}
    ${stat("down","تحت حد الطلب",n0(belowMin),belowMin?"محتاج طلبية":"كله تمام",belowMin?"var(--bad)":"var(--c-chem)","go('reports')")}
  </div>`;

  /* دونات: المخزون بالتصنيف */
  const catSegs = Object.entries(CATS).map(([k,v]) => ({
    l:v.ar, c:v.tint,
    v: live.filter(i => i.cat === k).reduce((a,i) => a + Math.max(0,balance(i.id)) * (i.cost||0), 0),
    q: live.filter(i => i.cat === k).reduce((a,i) => a + Math.max(0,balance(i.id)), 0)
  })).filter(x => x.v > 0 || x.q > 0);
  const useVal = catSegs.some(x => x.v > 0);
  const segs = catSegs.map(x => ({ l:x.l, c:x.c, v: useVal ? x.v : x.q }));
  const segTot = segs.reduce((a,x) => a+x.v, 0);
  const donutCard = segs.length ? `<div class="card">

      <div class="lg">${segs.map(x => `<div class="lg-row"><i style="background:${x.c}"></i><span class="nm">${x.l}</span>

  const ser7 = dailySeries(7, null, "out");

  const weekCard = `<div class="card">
    <div class="card-h"><h3>استهلاك الأسبوع</h3><span class="chip acc">${n1(ser7.reduce((a,x)=>a+x.v,0))}</span></div>
    ${barChart(ser7.map((x,k) => ({ l:AR_DAYS[new Date(x.d+"T00:00:00").getDay()].slice(0,3), v:x.v, c:PAL[k%PAL.length] })), { h:150 })}
  </div>`;

  /* أرصدة المراكز */
  const cs = centers().map(p => ({ p, st:partyStats(p.id) })).filter(x => x.st.qty > 0)
    .sort((a,b) => b.st.rem - a.st.rem).slice(0,3);
  const centersCard = cs.length ? `<div class="card">
    <div class="card-h"><h3>أرصدة المراكز</h3><span class="lnk" onclick="go('centers')">الكل</span></div>
    ${cs.map((x,k) => {
      const tint = PAL[k%PAL.length], pct = x.st.qty ? (x.st.rem/x.st.qty)*100 : 0;

  /* أرصدة الأصناف — شرائط ملوّنة */
  const bars = rows.filter(x => x.b > 0).sort((a,b) => a.cv - b.cv || b.b - a.b).slice(0,6);

      const st = covState(x.cv);
      const tail = x.cv === Infinity ? "" : ` <span class="mut2" style="font-size:10px;font-weight:400">· ${n0(x.cv)} يوم</span>`;
      return `<div data-bitem="${x.it.id}">${hbar(esc(x.it.name), x.b, mxB, st==="bad"?"var(--bad)":st==="warn"?"var(--warn)":tintOf(x.it),
        `${n1(x.b)} <span class="mut2" style="font-size:10px;font-weight:400">${esc(x.it.unit)}</span>${tail}`)}</div>`;
    }).join("")}
  </div>` : "";

  const alertsCard = A.length ? `<div class="card">
    <div class="card-h"><h3>تنبيهات</h3><span class="chip ${A[0].sev>=3?"bad":A[0].sev>=2?"warn":""}">${n0(A.length)}</span></div>

        <div class="ic" style="--tint:${a.tint}">${svg(a.ic)}</div>

      </div>`).join("")}</div>
    ${A.length>4?`<button class="btn soft wide sm" style="margin-top:10px" onclick="openAlerts()">شوف كل التنبيهات (${n0(A.length)})</button>`:""}

  const recent = S.moves.slice().sort((a,b) => (b.at||0)-(a.at||0)).slice(0,5);
  const recentCard = recent.length ? `<div class="card">
    <div class="card-h"><h3>آخر الحركات</h3><span class="lnk" onclick="go('moves')">الكل</span></div>
    <div class="rows">${recent.map(m => moveRow(m)).join("")}</div>
  </div>` : "";

  $("#s-home").innerHTML = hero + tiles + barsCard + stats + alertsCard + centersCard + donutCard + weekCard + recentCard;
  $$("#s-home [data-alert]").forEach(el => el.onclick = () => { buzz(); A[+el.dataset.alert].go(); });
  $$("#s-home [data-center]").forEach(el => el.onclick = () => openCenter(el.dataset.center));

  $$("#s-home [data-move]").forEach(el => el.onclick = () => openMoveDetail(el.dataset.move));

}
function stat(ic, k, v, sub, tint, act){
  return `<div class="stat" style="--tint:${tint}" onclick="${act}">
    <div class="k">${svg(ic)} <span>${k}</span></div>
    <div class="v dsp">${v}</div><div class="s">${sub}</div></div>`;
}
/* إجمالي الورق الموجود دلوقتي في كل الأصناف اللي بتتحسب بالورقة */
function paperOnHand(){
  return S.items.filter(i => !i.archived && SHEETY.includes(i.unit))
    .reduce((a,i) => a + Math.max(0, balance(i.id)), 0);
}
function paperPulled(from, to){
  let q = 0;
  for (const m of S.moves){
    if (m.type !== "out" && m.type !== "damage") continue;
    if (from && m.date < from) continue;
    if (to && m.date > to) continue;
    const it = item(m.itemId);
    if (it && SHEETY.includes(it.unit)) q += m.qty;
  }
  return q;
}
/* نسبة امتلاء المخزن — الموجود مقابل أعلى رصيد وصله */
function fillPct(){
  const live = S.items.filter(i => !i.archived);
  if (!live.length) return 0;
  let now = 0, ref = 0;
  for (const i of live){ now += Math.max(0, balance(i.id)); ref += refLevel(i); }
  return ref > 0 ? Math.max(0, Math.min(1, now / ref)) : 0;
}
/* إطار بيلف حوالين الكارت وبيزيد ويقل مع الرصيد */
function heroRing(pct, tint){
  const W = 340, H = 190, R = 26, sw = 3.5, pad = sw/2;
  const w = W - sw, h = H - sw;
  const d = `M ${pad+R} ${pad} H ${pad+w-R} A ${R} ${R} 0 0 1 ${pad+w} ${pad+R}`
          + ` V ${pad+h-R} A ${R} ${R} 0 0 1 ${pad+w-R} ${pad+h}`
          + ` H ${pad+R} A ${R} ${R} 0 0 1 ${pad} ${pad+h-R}`
          + ` V ${pad+R} A ${R} ${R} 0 0 1 ${pad+R} ${pad} Z`;
  const len = 2*(w-2*R) + 2*(h-2*R) + 2*Math.PI*R;
  return `<svg class="hero-ring" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path class="trk" d="${d}"/>

let cenQ = "";
function renderCenters(){
  const all = centers();
  let list = all;
  if (cenQ.trim()) list = list.filter(p => (p.name + " " + (p.phone||"")).includes(cenQ.trim()));
  const rank = list.map(p => ({ p, st:partyStats(p.id) })).sort((a,b) => b.st.rem - a.st.rem || b.st.qty - a.st.qty);
  const totQty = S.deals.reduce((a,d) => a + d.qty, 0);
  const totDel = S.deals.reduce((a,d) => a + dealDelivered(d.id), 0);
  const totPaid = S.deals.reduce((a,d) => a + (d.paid||0), 0);
  const PAL = ["var(--c-thermal)","var(--c-photo)","var(--c-plastic)","var(--c-film)","var(--c-chem)","var(--c-ink)","var(--c-misc)"];

  let h = `<div class="stat-grid">
    ${stat("center","مراكز",n0(all.length),`${n0(S.deals.filter(d=>dealRemaining(d)>0).length)} طلبية مفتوحة`,"var(--c-plastic)","")}
    ${stat("wallet","المحصّل",money(totPaid),`${n0(S.deals.length)} طلبية`,"var(--ok)","")}
    ${stat("check","اتسلّم",n1(totDel),`من ${n1(totQty)}`,"var(--c-thermal)","")}
    ${stat("target","باقي تسليمه",n1(Math.max(0,totQty-totDel)),totQty?`${n0(((totQty-totDel)/totQty)*100)}٪ من المتعاقد`:"—","var(--acc)","")}
  </div>
  <div class="btn-row" style="margin-bottom:14px">
    <button class="btn" onclick="openDealForm()">${svg("plus",15)} طلبية جديدة</button>
    <button class="btn ghost" onclick="openPartyForm()">${svg("people",15)} مركز جديد</button>
  </div>
  ${all.length>3?`<div class="search">${svg("search")}<input id="cenSearch" placeholder="دوّر على مركز" value="${esc(cenQ)}"></div>`:""}`;

      <p>ضيف المركز، وبعدها سجّل الكمية اللي اشتراها ودفع حقها — وكل تسليم هيقلّل الشريط لحد ما تخلص.</p>

      const done = st.qty > 0 && st.rem <= 0;
      const un = item(st.ds[0] && st.ds[0].itemId)?.unit || "";
      return `<div class="card" data-cen="${x.p.id}" style="border-inline-start:3px solid ${done?"var(--ok)":tint}">
        <div style="display:flex;align-items:center;gap:11px;margin-bottom:12px">
          ${partyLogo(x.p, 44, tint)}
          <div style="flex:1;min-width:0">
            <div style="font-size:14.5px;font-weight:600">${esc(x.p.name)}</div>
            <div class="mut2" style="font-size:11.5px">${x.p.phone?esc(x.p.phone)+" · ":""}${st.ds.length?`${n0(st.ds.length)} طلبية`:"مفيش طلبيات"}</div>
          </div>
          ${done?`<span class="chip ok tickin">${svg("check",12)} اكتملت</span>`:st.qty?`<span class="chip" style="background:color-mix(in srgb,${tint} 15%,transparent);color:${tint};border-color:transparent">${n0(pct)}٪ باقي</span>`:""}
        </div>

        ${trafficLights(st.del, st.rem, st.qty, un)}

          <button class="btn soft sm" style="flex:1" data-deliver="${x.p.id}">${svg("truck",14)} سلّم كمية</button>

function trafficLights(del, rem, tot, unit){
  const pct = tot > 0 ? rem / tot : 0;
  const remCls = rem <= 0 ? "g" : pct > 0.6 ? "r blink" : "a";
  return `<div class="tl">
    <div class="g"><span class="lamp"></span><div class="n">${n1(del)}</div><div class="w">اتسلّم</div></div>
    <div class="${remCls}"><span class="lamp"></span><div class="n">${rem<=0?"تم":n1(rem)}</div><div class="w">${rem<=0?"مفيش باقي":"باقي"}</div></div>
    <div class="n0"><span class="lamp"></span><div class="n">${n1(tot)}</div><div class="w">الإجمالي${unit?` · ${esc(unit)}`:""}</div></div>
  </div>`;
}

/* =========================================================
   المخزون
   ========================================================= */
let stockQ = "", stockCat = "all", stockSort = "risk", stockStore = "all", stockTab = "items";

function refLevel(it){
  if (it.max) return it.max;
  let peak = balance(it.id);
  let run = 0;
  const ms = S.moves.filter(m => m.itemId === it.id).slice().sort((a,b) => a.date < b.date ? -1 : 1);
  for (const m of ms){ run += effect(m, null); if (run > peak) peak = run; }
  return Math.max(peak, (it.min || 0) * 3, 1);
}
function reamBar(it, b, tint){
  const ref = refLevel(it), pct = Math.max(0, Math.min(1, b / ref));
  const N = 16, filled = Math.round(pct * N);
  let bars = "";
  for (let i = 0; i < N; i++){
    const h = 38 + (i % 3) * 4 + Math.min(52, i * 3.6);
    bars += `<i class="${i < filled ? "f" : ""}" style="height:${h}%;animation-delay:${i*22}ms"></i>`;
  }
  return `<div class="ream" style="--tint:${tint}">
    <div class="ream-bars">${bars}</div>
    <div class="ream-legend"><span>${n0(0)}</span><span>${n0(pct*100)}٪ من ${n0(ref)}</span><span>${n0(ref)}</span></div>
  </div>`;
}

    $$("#s-stock [data-buy]").forEach(b => b.onclick = e => { e.stopPropagation(); openMoveForm("in", null, { party:b.dataset.buy }); });

  }
  const cats = [["all","الكل"], ...Object.entries(CATS).map(([k,v]) => [k, v.ar])];
  const sorts = [["risk","الأخطر"],["name","الاسم"],["qty","الرصيد"],["use","الاستهلاك"]];
  let list = S.items.filter(i => !i.archived);

    list = list.filter(i => (i.name + " " + (i.code||"") + " " + (i.size||"")).includes(q));
  }
  const rows = list.map(i => ({ it:i, b: stockStore==="all" ? balance(i.id) : balance(i.id, stockStore), cv:coverage(i.id), use:consumedBetween(i.id, addDays(todayISO(),-29), todayISO()) }));

  </div>
  <div class="seg">${sorts.map(([k,v]) => `<button class="${stockSort===k?"on":""}" data-sort="${k}">${v}</button>`).join("")}</div>`;

    const chipCls = st === "bad" ? "bad" : st === "warn" ? "warn" : st === "ok" ? "ok" : "";

        <div style="flex:1;min-width:0">

          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">
            ${it.size?`<span class="chip">${esc(it.size)}</span>`:""}
            <span class="chip">${CATS[it.cat]?.ar||"مستلزمات"}</span>
            <span class="chip ${chipCls}">${cvTxt}</span>
          </div>
        </div>
        <div style="text-align:end;flex:none">
          <div class="num" style="font-size:23px;line-height:1.1;color:${r.b<=0?"var(--bad)":"var(--ink)"}">${n1(r.b)}</div>
          <div class="mut2" style="font-size:10.5px">${esc(it.unit)}${isSheet(it)&&r.b>0?` · ${n1(r.b/it.pack)} علبة`:""}</div>
        </div>
      </div>
      ${reamBar(it, r.b, tint)}
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn soft sm" style="flex:1" data-quick="in|${it.id}">${svg("in",14)} استلام</button>
        <button class="btn soft sm" style="flex:1;background:var(--acc-soft);color:var(--acc)" data-quick="out|${it.id}">${svg("out",14)} صرف</button>
      </div>

  }).join("") : `<div class="empty">
      <div class="ic">${svg("box",28)}</div>
      <h4>${S.items.length ? "مفيش نتايج" : "مفيش أصناف لسه"}</h4>
      <p>${S.items.length ? "جرّب تغيّر البحث أو التصنيف." : "ضيف الورق والفيلم والكيماويات اللي بتشتغل بيها."}</p>
      <button class="btn" onclick="openItemForm()">${svg("plus",16)} صنف جديد</button>
    </div>`;

  $("#s-stock").innerHTML = seg + head + `<div>${body}</div>`;
  bindTabs();

  const si = $("#stockSearch");
  si.oninput = () => { stockQ = si.value; const p = si.selectionStart; renderStock(); const n = $("#stockSearch"); n.focus(); n.setSelectionRange(p,p); };
  $$("#s-stock [data-cat]").forEach(b => b.onclick = () => { stockCat = b.dataset.cat; buzz(6); renderStock(); });
  $$("#s-stock [data-store]").forEach(b => b.onclick = () => { stockStore = b.dataset.store; buzz(6); renderStock(); });
  $$("#s-stock [data-sort]").forEach(b => b.onclick = () => { stockSort = b.dataset.sort; buzz(6); renderStock(); });
  $$("#s-stock [data-item]").forEach(el => el.onclick = e => { if (e.target.closest("[data-quick]")) return; openItem(el.dataset.item); });

/* =========================================================
   الرسوم البيانية (SVG يدوي بدون مكتبات)
   ========================================================= */
function lineChart(series, opt){
  opt = opt || {};
  const W = 320, H = opt.h || 130, PL = 6, PR = 6, PT = 12, PB = 20;
  const iw = W - PL - PR, ih = H - PT - PB;
  const vals = series.map(s => s.v);
  const mx = Math.max(1, ...vals);
  const n = series.length;
  const X = i => PL + (n === 1 ? iw/2 : (i / (n-1)) * iw);
  const Y = v => PT + ih - (v / mx) * ih;
  const pts = series.map((s,i) => [X(i), Y(s.v)]);
  const d = pts.map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = d + ` L ${pts[pts.length-1][0].toFixed(1)} ${PT+ih} L ${pts[0][0].toFixed(1)} ${PT+ih} Z`;
  let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
  const grid = [0,.5,1].map(f => `<line class="grid" x1="${PL}" y1="${PT+ih*f}" x2="${W-PR}" y2="${PT+ih*f}"/>`).join("");
  const step = Math.max(1, Math.ceil(n/5));
  const labels = series.map((s,i) => (i % step === 0 || i === n-1) ? `<text class="fade" x="${X(i)}" y="${H-5}" text-anchor="middle">${fDate(s.d)}</text>` : "").join("");
  const tint = opt.tint || "var(--acc)";
  const last = pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    <defs><linearGradient id="gf${opt.id||0}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${tint}" stop-opacity=".26"/><stop offset="100%" stop-color="${tint}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#gf${opt.id||0})" class="fade"/>
    <path class="ln anim" d="${d}" style="--len:${len.toFixed(0)};stroke:${tint}"/>
    <circle class="pt fade" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" style="stroke:${tint}"/>
    <text class="fade" x="${PL}" y="${PT-2}" text-anchor="start">${n0(mx)}</text>
    ${labels}
  </svg>`;
}
function barChart(data, opt){
  opt = opt || {};
  const W = 320, H = opt.h || 140, PL = 6, PR = 6, PT = 14, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  const mx = Math.max(1, ...data.map(d => d.v));
  const n = data.length, gap = 6;
  const bw = Math.max(6, (iw - gap*(n-1)) / n);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    ${[0,.5,1].map(f => `<line class="grid" x1="${PL}" y1="${PT+ih*f}" x2="${W-PR}" y2="${PT+ih*f}"/>`).join("")}
    ${data.map((d,i) => {
      const h = Math.max(2, (d.v/mx)*ih), x = PL + i*(bw+gap), y = PT + ih - h;
      return `<g class="bar-g" style="animation-delay:${i*55}ms;transform-box:fill-box">
        <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(5,bw/2)}" fill="${d.c||opt.tint||"var(--pri)"}"/>
      </g>
      <text class="fade" x="${(x+bw/2).toFixed(1)}" y="${H-13}" text-anchor="middle">${esc(d.l)}</text>
      <text class="fade" x="${(x+bw/2).toFixed(1)}" y="${H-2}" text-anchor="middle" style="fill:var(--ink2);font-weight:600">${n1(d.v)}</text>`;
    }).join("")}
  </svg>`;
}

let repRange = 30;
function renderReports(){
  const t = todayISO();
  const from = addDays(t, -(repRange-1));
  const ser = dailySeries(repRange, null, "out");
  const serIn = dailySeries(repRange, null, "in");
  const totOut = ser.reduce((s,x) => s+x.v, 0), totIn = serIn.reduce((s,x) => s+x.v, 0);
  const live = S.items.filter(i => !i.archived);

  /* بالتصنيف */
  const byCat = Object.entries(CATS).map(([k,v]) => ({
    l:v.ar, c:v.tint,
    v: live.filter(i => i.cat === k).reduce((s,i) => s + consumedBetween(i.id, from, t), 0)
  })).filter(x => x.v > 0);

  /* الأكثر استهلاكاً */
  const top = live.map(i => ({ it:i, q:consumedBetween(i.id, from, t) })).filter(x => x.q>0).sort((a,b) => b.q-a.q).slice(0,6);
  const mx = top.length ? top[0].q : 1;

  /* توقّع الطلبية */
  const need = live.map(i => ({ it:i, b:balance(i.id), cv:coverage(i.id), a:avgDaily(i.id) }))
    .filter(x => x.cv !== Infinity && x.cv <= 30)
    .sort((a,b) => a.cv - b.cv);

  /* المخازن */
  const byStore = S.stores.map(s => ({
    s, v: live.reduce((a,i) => a + balance(i.id, s.id) * (i.cost||0), 0),
    q: live.reduce((a,i) => a + balance(i.id, s.id), 0)
  }));
  const mxStore = Math.max(1, ...byStore.map(x => x.v));

  /* مقارنة شهرية */
  const months = [];
  for (let k = 5; k >= 0; k--){
    const d = new Date(); d.setMonth(d.getMonth()-k, 1);
    const f = todayISO(d), lastD = new Date(d.getFullYear(), d.getMonth()+1, 0);
    months.push({ l:AR_MON[d.getMonth()].slice(0,4), v: consumedBetween(null, f, todayISO(lastD)) });
  }

  const ranges = [[7,n0(7)+" أيام"],[30,n0(30)+" يوم"],[90,n0(90)+" يوم"]];
  let h = `<div class="seg">${ranges.map(([k,v]) => `<button class="${repRange===k?"on":""}" data-rr="${k}">${v}</button>`).join("")}</div>`;

  h += `<div class="card">
    <div class="card-h"><h3>الاستهلاك اليومي</h3><span class="chip acc">${n1(totOut)} إجمالي</span></div>
    ${lineChart(ser, { tint:"var(--acc)", id:1 })}
    <div style="display:flex;gap:10px;margin-top:12px;text-align:center">
      <div style="flex:1"><div class="mut2" style="font-size:11px">متوسط يومي</div><div class="num" style="font-size:18px">${n1(totOut/repRange)}</div></div>
      <div style="width:1px;background:var(--line)"></div>
      <div style="flex:1"><div class="mut2" style="font-size:11px">أعلى يوم</div><div class="num" style="font-size:18px">${n1(Math.max(0,...ser.map(x=>x.v)))}</div></div>
      <div style="width:1px;background:var(--line)"></div>
      <div style="flex:1"><div class="mut2" style="font-size:11px">أيام بدون صرف</div><div class="num" style="font-size:18px">${n0(ser.filter(x=>x.v===0).length)}</div></div>
    </div>
  </div>`;

  h += `<div class="card">
    <div class="card-h"><h3>الوارد اليومي</h3><span class="chip ok">${n1(totIn)} إجمالي</span></div>
    ${lineChart(serIn, { tint:"var(--ok)", id:2, h:110 })}
  </div>`;

  if (byCat.length) h += `<div class="card">
    <div class="card-h"><h3>الاستهلاك بالتصنيف</h3></div>
    ${barChart(byCat, { h:150 })}
  </div>`;

  if (months.some(m => m.v > 0)) h += `<div class="card">
    <div class="card-h"><h3>مقارنة الشهور</h3><span class="mut2" style="font-size:11.5px">آخر ${n0(6)} شهور</span></div>
    ${barChart(months, { tint:"var(--pri)", h:150 })}
  </div>`;

  if (top.length) h += `<div class="card">
    <div class="card-h"><h3>الأصناف الأكثر استهلاكاً</h3></div>
    ${top.map(x => `<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
        <span style="font-size:13.5px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(x.it.name)}</span>
        <span class="num" style="font-size:14px;color:${tintOf(x.it)}">${n1(x.q)}</span>
      </div>
      <div class="bar"><i style="width:${Math.max(6,(x.q/mx)*100)}%;background:${tintOf(x.it)}"></i></div>
    </div>`).join("")}
  </div>`;

  h += `<div class="card">
    <div class="card-h"><h3>قائمة الطلب المقترحة</h3><span class="chip ${need.length?"warn":"ok"}">${n0(need.length)}</span></div>
    ${need.length ? `<div class="rows">${need.map(x => {
      const st = covState(x.cv);
      let sug = Math.max(x.it.min||0, Math.ceil(x.a * 45));
      if (isSheet(x.it)) sug = Math.ceil(sug / x.it.pack) * x.it.pack;
      return `<div class="row" data-item="${x.it.id}">
        <div class="ic" style="--tint:${tintOf(x.it)}">${svg(icOf(x.it))}</div>
        <div class="mid"><div class="t">${esc(x.it.name)}</div>
          <div class="d">رصيد ${n1(x.b)} · ${n1(x.a)}/يوم · يخلص ${fDate(addDays(t, Math.floor(x.cv)))}</div></div>
        <div class="end"><div class="v num" style="color:${st==="bad"?"var(--bad)":"var(--warn)"}">${n0(sug)}</div><div class="u">${isSheet(x.it)?n0(sug/x.it.pack)+" علبة":"اطلب"}</div></div>
      </div>`;
    }).join("")}</div>
    <button class="btn soft wide sm" style="margin-top:12px" onclick="exportOrder()">${svg("file",14)} نسخ قائمة الطلب</button>`
    : `<div class="mut" style="font-size:13px;text-align:center;padding:14px 0">كل الأصناف تغطيتها أكتر من ${n0(30)} يوم 👌</div>`}
  </div>`;

  if (S.stores.length > 1) h += `<div class="card">
    <div class="card-h"><h3>توزيع المخازن</h3></div>
    ${byStore.map(x => `<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">
        <span style="font-size:13.5px;font-weight:600">${esc(x.s.name)}</span>
        <span class="num" style="font-size:13.5px">${money(x.v)}</span>
      </div>
      <div class="bar"><i style="width:${Math.max(4,(x.v/mxStore)*100)}%"></i></div>
      <div class="mut2" style="font-size:11px;margin-top:3px">${n1(x.q)} وحدة</div>
    </div>`).join("")}
  </div>`;

  const cenRows = centers().map(p => ({ p, st:partyStats(p.id) })).filter(x => x.st.qty > 0).sort((a,b) => b.st.rem - a.st.rem);
  const PAL2 = ["var(--c-thermal)","var(--c-photo)","var(--c-plastic)","var(--c-film)","var(--c-chem)","var(--c-ink)","var(--c-misc)"];
  if (cenRows.length) h += `<div class="card">
    <div class="card-h"><h3>أرصدة المراكز</h3><span class="lnk" onclick="go('centers')">الكل</span></div>
    ${cenRows.map((x,k) => {
      const tint = PAL2[k%PAL2.length], done = x.st.rem <= 0;
      return `<div style="margin-bottom:14px" data-cenr="${x.p.id}">
        <div class="hb-top"><span class="l" style="display:flex;align-items:center;gap:7px">${partyLogo(x.p, 22, tint)}<span style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(x.p.name)}</span></span>
          <span class="num" style="color:${done?"var(--ok)":tint}">${done?"اكتملت ✅":n1(x.st.rem)+" باقي"}</span></div>
        ${depBar(x.st.rem, x.st.qty, tint)}
        <div class="mut2" style="font-size:11px;margin-top:5px">اتسلّم ${n1(x.st.del)} من ${n1(x.st.qty)} · محصّل ${money(x.st.paid)}</div>
      </div>`;
    }).join("")}
  </div>`;

  h += `<div class="card">
    <div class="card-h"><h3>تقرير للطباعة</h3></div>
    <p class="mut" style="font-size:13px;margin:0 0 12px">كشف كامل بالأرصدة والاستهلاك يفتح في صفحة جديدة جاهز للطباعة أو الحفظ PDF.</p>
    <button class="btn wide" onclick="printReport()">${svg("file",16)} افتح التقرير</button>
  </div>`;

  $("#s-reports").innerHTML = h;
  $$("#s-reports [data-rr]").forEach(b => b.onclick = () => { repRange = +b.dataset.rr; buzz(6); renderReports(); });
  $$("#s-reports [data-item]").forEach(el => el.onclick = () => openItem(el.dataset.item));
  $$("#s-reports [data-cenr]").forEach(el => el.onclick = () => openCenter(el.dataset.cenr));
}
