function renderMore(){
  const live = S.items.filter(i => !i.archived).length;
  const arch = S.items.length - live;
  const grp = (title, rows) => `<div class="card"><div class="card-h"><h3>${title}</h3></div><div class="rows">${rows}</div></div>`;
  const R = (ic, tint, t, d, act) => `<div class="row" data-act="${act}">
      <div class="ic" style="--tint:${tint}">${svg(ic)}</div>
      <div class="mid"><div class="t">${t}</div><div class="d">${d}</div></div>
      <div class="end mut2">${svg("back",16)}</div>
    </div>`;

  let h = `<div class="card" style="text-align:center;padding:20px">
    <div style="width:56px;height:56px;border-radius:19px;margin:0 auto 10px;display:grid;place-items:center;background:linear-gradient(150deg,var(--pri),var(--acc));color:#fff">${svg("box",26)}</div>
    <div class="dsp" style="font-size:20px">${esc(S.cfg.biz||"مخزوني")}</div>
    <div class="mut" style="font-size:12.5px">${esc(S.cfg.sub||"")}</div>
    <div style="display:flex;gap:10px;margin-top:14px;text-align:center">
      <div style="flex:1"><div class="num" style="font-size:19px">${n0(live)}</div><div class="mut2" style="font-size:11px">صنف</div></div>
      <div style="width:1px;background:var(--line)"></div>
      <div style="flex:1"><div class="num" style="font-size:19px">${n0(S.stores.length)}</div><div class="mut2" style="font-size:11px">مخزن</div></div>
      <div style="width:1px;background:var(--line)"></div>
      <div style="flex:1"><div class="num" style="font-size:19px">${n0(S.moves.length)}</div><div class="mut2" style="font-size:11px">حركة</div></div>
    </div>
  </div>`;

  h += grp("البيانات الأساسية",
    R("box","var(--c-thermal)","الأصناف",`${n0(live)} نشط${arch?` · ${n0(arch)} مؤرشف`:""}`,"items") +
    R("gloss","var(--c-plastic)","وحدة كل الأصناف = ورقة",`${n0(S.items.filter(i=>i.unit==="ورقة").length)} من ${n0(S.items.length)} بالورقة`,"tosheets") +
    R("store","var(--pri)","المخازن",`${n0(S.stores.length)} مخزن`,"stores") +
    R("people","var(--c-film)","العملاء والمراكز",`${n0(S.parties.filter(x=>x.kind!=="sup").length)} جهة`,"parties") +
    R("truck","var(--c-misc)","الموردين والمشتريات",`${n0(S.parties.filter(x=>x.kind==="sup").length)} مورد · مستحق ${money(supTotals().due)}`,"suppliers") +
    R("wallet","var(--c-photo)","طلبيات المراكز",`${n0(S.deals.length)} طلبية · ${n0(S.deals.filter(d=>dealRemaining(d)>0).length)} مفتوحة`,"deals")
  );

  h += grp("المساعد",
    R("spark","var(--acc)","اسأل المساعد","إجابات فورية من بيانات مخزنك","ask")
  );

  h += grp("المستخدم والصلاحيات",
    R("user", avColor(ME), ME?esc(ME.name):"—", ME?`@${esc(ME.user)} · ${ROLES[ME.role]?.ar||""}`:"", "me") +
    (can("admin") ? R("users","var(--c-film)","إدارة المستخدمين",`${n0(S.users.length)} حساب`,"users") : "") +
    R("logout","var(--bad)","تسجيل الخروج","تقفل الجلسة على الجهاز ده","logout")
  );

  h += grp("الإعدادات",
    R("cog","var(--ink2)","بيانات الشركة","الاسم اللي بيظهر فوق","biz") +
    R("clock","var(--warn)","حدود التنبيه",`تحذير ${n0(S.cfg.covWarn)} يوم · خطر ${n0(S.cfg.covBad)} يوم`,"limits") +
    R("spark","var(--acc)","المظهر", themeLabel(),"theme") +
    R("calc","var(--info)","شكل الأرقام", S.cfg.digits==="en"?"١٢٣ إنجليزي (123)":"١٢٣ عربي","digits")
  );

  h += grp("المزامنة",
    R("cloud", TOKEN?"var(--ok)":"var(--ink3)", TOKEN?"متزامن":"المزامنة بين الأجهزة",
      TOKEN?`${esc(UNAME)} · آخر مزامنة ${relTime(LASTSYNC)}`:"سجّل حساب وشغّل نفس البيانات على أكتر من جهاز","sync")
  );

  h += grp("النسخ الاحتياطي",
    R("down","var(--ok)","تصدير نسخة","ملف JSON بكل البيانات","export") +
    R("up","var(--info)","استيراد نسخة","استرجاع من ملف محفوظ","import") +
    R("file","var(--c-misc)","تصدير الحركات CSV","يفتح في إكسل","csv") +
    R("trash","var(--bad)","مسح كل البيانات","ابدأ من الأول","wipe")
  );

  h += `<div class="card" style="text-align:center">
    <div class="mut2" style="font-size:12px">مخزوني — نسخة ${n0(1)}.${n0(0)} · بيانات محفوظة على الجهاز</div>
  </div>`;

  $("#s-more").innerHTML = h;
  $$("#s-more [data-act]").forEach(el => el.onclick = () => moreAction(el.dataset.act));
}
function themeLabel(){ return { auto:"تلقائي حسب الجهاز", light:"نهاري", dark:"ليلي" }[S.cfg.theme] || "تلقائي"; }

function moreAction(a){
  buzz();
  if (a === "items") openItemsList();
  if (a === "ask"){ askOpen = -1; askQ = ""; renderAsk(); }
  if (a === "users") openUsers();
  if (a === "me") openMe();
  if (a === "logout") openLogout();
  if (a === "suppliers"){ stockTab = "sup"; go("stock"); }
  if (a === "sync") openSync();
  if (a === "tosheets") openToSheets();
  if (a === "stores") openStores();
  if (a === "parties") openParties();
  if (a === "deals") go("centers");
  if (a === "biz") openBiz();
  if (a === "limits") openLimits();
  if (a === "theme") openTheme();
  if (a === "digits") openDigits();
  if (a === "export") doExport();
  if (a === "import") doImport();
  if (a === "csv") doCSV();
  if (a === "wipe") openWipe();
}

/* =========================================================
   الشيتات
   ========================================================= */
function sheet(title, html, onOpen){
  $("#sheetTitle").textContent = title;
  $("#sheetBody").innerHTML = html;
  $("#sheet").classList.add("on");
  $("#scrim").classList.add("on");
  document.body.style.overflow = "hidden";
  $("#sheetBody").scrollTop = 0;
  /* الربط هنا كل مرة — عشان ميحصلش إن الزرار يفضل مربوط بشاشة قديمة */
  const x = $("#sheetX");
  x.onclick = (e) => { e.preventDefault(); e.stopPropagation(); closeSheet(); };
  x.ontouchend = (e) => { e.preventDefault(); closeSheet(); };
  if (onOpen) onOpen();
}
function closeSheet(){
  const sh = $("#sheet");
  sh.classList.remove("on");
  sh.style.transform = "";
  $("#scrim").classList.remove("on");
  document.body.style.overflow = "";
  try{ document.activeElement && document.activeElement.blur(); }catch(e){}
}

/* ---------- تفاصيل صنف ---------- */
function openItem(id){
  const it = item(id); if (!it) return;
  const tint = tintOf(it), b = balance(id), cv = coverage(id), st = covState(cv), a = avgDaily(id);
  const bs = balancesByStore(id);
  const hist = S.moves.filter(m => m.itemId === id).sort((x,y) => x.date === y.date ? (y.at||0)-(x.at||0) : (x.date < y.date ? 1 : -1)).slice(0,12);
  const ser = dailySeries(30, id, "out");
  const runOut = (cv !== Infinity && b > 0) ? addDays(todayISO(), Math.floor(cv)) : null;

  const h = `
  <div style="display:flex;gap:11px;align-items:flex-start;margin-bottom:14px">
    <div style="width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,${tint} 14%,transparent);color:${tint}">${svg(icOf(it),22)}</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:16px;font-weight:700">${esc(it.name)}</div>
      <div class="mut2" style="font-size:12px">${[it.code, it.size, CATS[it.cat]?.ar, it.color, it.model].filter(Boolean).map(esc).join(" · ")}</div>
    </div>
    <button class="icon-btn" onclick="openItemForm('${id}')">${svg("edit",17)}</button>
  </div>

  <div class="card" style="margin:0 0 14px;background:var(--surf2)">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px">
      <div><div class="mut2" style="font-size:11.5px">الرصيد الحالي</div>
        <div class="num" style="font-size:32px;line-height:1.1;color:${b<=0?"var(--bad)":"var(--ink)"}">${n1(b)} <span class="mut2" style="font-size:13px;font-weight:400">${esc(it.unit)}</span></div>
        ${isSheet(it)?`<div class="mut2" style="font-size:11.5px;margin-top:2px">= ${n1(b/it.pack)} علبة · العلبة ${n0(it.pack)} ${esc(it.unit)}</div>`:""}</div>
      <span class="chip ${st==="bad"?"bad":st==="warn"?"warn":st==="ok"?"ok":""}">${cv===Infinity?"بدون استهلاك":`${n0(cv)} يوم تغطية`}</span>
    </div>
    ${reamBar(it, b, tint)}
  </div>

  <div class="grid3" style="margin-bottom:14px">
    <div class="card tight" style="margin:0;text-align:center"><div class="mut2" style="font-size:10.5px">متوسط يومي</div><div class="num" style="font-size:17px">${n1(a)}</div></div>
    <div class="card tight" style="margin:0;text-align:center"><div class="mut2" style="font-size:10.5px">حد الطلب</div><div class="num" style="font-size:17px">${it.min?n0(it.min):"—"}</div></div>
    <div class="card tight" style="margin:0;text-align:center"><div class="mut2" style="font-size:10.5px">قيمة الرصيد</div><div class="num" style="font-size:15px">${money(b*(it.cost||0))}</div></div>
  </div>

  ${runOut ? `<div class="card" style="background:${st==="bad"?"var(--bad-soft)":st==="warn"?"var(--warn-soft)":"var(--ok-soft)"};border-color:transparent;display:flex;gap:10px;align-items:center">
    <div style="color:${st==="bad"?"var(--bad)":st==="warn"?"var(--warn)":"var(--ok)"}">${svg("clock",20)}</div>
    <div style="font-size:13px;line-height:1.5">بالمعدل الحالي هيخلص <b>${fDateFull(runOut)}</b>${it.lead?` — والتوريد بياخد ${n0(it.lead)} يوم، يعني اطلب قبل ${fDate(addDays(runOut,-it.lead))}`:""}</div>
  </div>` : ""}

  ${S.stores.length > 1 ? `<div class="card">
    <div class="card-h"><h3>الأرصدة بالمخازن</h3></div>
    <div class="rows">${S.stores.map(s => `<div class="row" style="padding:8px 0">
      <div class="ic" style="--tint:var(--pri);width:34px;height:34px;border-radius:11px">${svg("store",16)}</div>
      <div class="mid"><div class="t" style="font-size:13.5px">${esc(s.name)}</div></div>
      <div class="end"><div class="v num" style="font-size:15px">${n1(bs[s.id])}</div></div>
    </div>`).join("")}</div>
  </div>` : ""}

  ${ser.some(x => x.v > 0) ? `<div class="card">
    <div class="card-h"><h3>استهلاك ${n0(30)} يوم</h3></div>
    ${lineChart(ser, { tint, id:9, h:110 })}
  </div>` : ""}

  <div class="btn-row" style="margin:14px 0">
    <button class="btn" onclick="closeSheet();openMoveForm('in','${id}')">${svg("in",15)} استلام</button>
    <button class="btn" style="background:var(--acc);color:#241703" onclick="closeSheet();openMoveForm('out','${id}')">${svg("out",15)} صرف</button>
  </div>
  <div class="btn-row" style="margin-bottom:14px">
    <button class="btn ghost sm" onclick="closeSheet();openMoveForm('adjust','${id}')">${svg("scale",14)} جرد</button>
    <button class="btn ghost sm" onclick="closeSheet();openMoveForm('damage','${id}')">${svg("warn",14)} هالك</button>
    ${S.stores.length>1?`<button class="btn ghost sm" onclick="closeSheet();openMoveForm('move','${id}')">${svg("swap",14)} تحويل</button>`:""}
  </div>

  <div class="card">
    <div class="card-h"><h3>آخر الحركات</h3></div>
    ${hist.length ? `<div class="rows">${hist.map(m => moveRow(m)).join("")}</div>` : `<div class="mut" style="font-size:13px;text-align:center;padding:10px 0">مفيش حركات لسه</div>`}
  </div>`;

  sheet(it.name, h, () => {
    $$("#sheetBody [data-move]").forEach(el => el.onclick = () => openMoveDetail(el.dataset.move));
  });
}

/* ---------- نموذج الصنف ---------- */
let formCat = "thermal", formUnit = "ورقة";
function openItemForm(id){
  if (!need("edit")) return;
  const it = id ? item(id) : null;
  formCat = it ? it.cat : "thermal";
  formUnit = it ? it.unit : "ورقة";
  const h = `
  <div class="field"><label>اسم الصنف</label>
    <input id="fName" value="${esc(it?it.name:"")}" placeholder="مثال: ورق حراري سوني UPP-110HG"></div>
  <div class="grid2">
    <div class="field"><label>الكود</label><input id="fCode" value="${esc(it?it.code:"")}" placeholder="اختياري"></div>
    <div class="field"><label>المقاس</label><input id="fSize" value="${esc(it?it.size:"")}" placeholder="14×17 / 110mm"></div>
  </div>
  <div class="field"><label>التصنيف</label>
    <div class="picks" id="fCats">${Object.entries(CATS).map(([k,v]) => `<button class="pick ${formCat===k?"on":""}" data-c="${k}">${v.ar}</button>`).join("")}</div>
  </div>
  <div class="field"><label>وحدة القياس</label>
    <div class="picks" id="fUnits"></div>
    <div class="hint" id="fUnitHint"></div>
  </div>
  <div id="fKit"></div>
  <div class="grid2">
    <div class="field"><label>سعر الوحدة الواحدة</label><input id="fCost" type="number" inputmode="decimal" value="${it&&it.cost?it.cost:""}" placeholder="٠"></div>
    <div class="field"><label>حد الطلب</label><input id="fMin" type="number" inputmode="decimal" value="${it&&it.min?it.min:""}" placeholder="٠"></div>
  </div>
  <div class="grid2">
    <div class="field"><label>السعة القصوى</label><input id="fMax" type="number" inputmode="decimal" value="${it&&it.max?it.max:""}" placeholder="اختياري"><div class="hint">بيظهر في شريط الرصيد</div></div>
    <div class="field"><label>مدة التوريد (يوم)</label><input id="fLead" type="number" inputmode="numeric" value="${it&&it.lead?it.lead:""}" placeholder="٧"></div>
  </div>
  <div class="field"><label>تاريخ انتهاء الصلاحية</label><input id="fExp" type="date" value="${esc(it?it.exp:"")}"></div>
  <div class="field"><label>ملاحظات</label><textarea id="fNote" placeholder="اسم المورد، رقم الموديل، أي حاجة">${esc(it?it.note:"")}</textarea></div>
  ${!it ? `<div class="field"><label>رصيد افتتاحي</label><input id="fOpen" type="number" inputmode="decimal" placeholder="٠"><div class="hint">بالوحدة اللي اخترتها — هيتسجّل كحركة وارد بتاريخ النهاردة</div></div>` : ""}
  <button class="btn wide" id="fSave">${svg("check",16)} ${it?"احفظ التعديل":"ضيف الصنف"}</button>
  ${it ? `<div class="btn-row" style="margin-top:9px">
    <button class="btn ghost sm" onclick="archiveItem('${it.id}')">${svg("box",14)} ${it.archived?"رجّع الصنف":"أرشفة"}</button>
    <button class="btn danger sm" onclick="delItem('${it.id}')">${svg("trash",14)} حذف نهائي</button>
  </div>` : ""}
  <div style="height:10px"></div>`;

  sheet(it ? "تعديل صنف" : "صنف جديد", h, () => {
    /* الوحدات والحقول بتتغيّر مع التصنيف — الحبر مش هيتسأل عن أوراق في العلبة */
    const drawUnits = () => {
      const kit = CAT_KIT[formCat] || CAT_KIT.misc;
      const list = kit.units.concat(UNITS.filter(u => !kit.units.includes(u)));
      if (!kit.units.includes(formUnit) && !(it && it.unit === formUnit)) formUnit = kit.units[0];
      $("#fUnits").innerHTML = list.map(u =>
        `<button class="pick ${formUnit===u?"on":""}" data-u="${esc(u)}">${u}</button>`).join("");
      $$("#fUnits .pick").forEach(b => b.onclick = () => {
        formUnit = b.dataset.u; $$("#fUnits .pick").forEach(x => x.classList.toggle("on", x === b));
        buzz(6); drawKit(); hintUnit();
      });
      hintUnit();
    };
    const hintUnit = () => {
      const k = catKind(formCat);
      $("#fUnitHint").textContent =
        k === "paper" ? "الرصيد بيتحسب بالوحدة دي — الأفضل «ورقة»."
        : k === "ink" ? "الأحبار بتتحسب بالعلبة أو القطعة."
        : k === "chem" ? "الكيماويات بتتحسب باللتر أو العلبة."
        : "اختار الوحدة اللي بتتعامل بيها.";
    };
    const drawKit = () => {
      const k = catKind(formCat), sheety = SHEETY.includes(formUnit);
      let kit = "";
      if (k === "paper"){
        kit = `<div class="grid2">
          <div class="field"><label>${sheety?"عدد الأوراق في العلبة":"عدد الأوراق في الوحدة"}</label>
            <input id="fPack" type="number" inputmode="numeric" value="${it&&it.pack?it.pack:""}" placeholder="٦٠٠">
            <div class="hint">للتحويل التلقائي</div></div>
          <div class="field"><label>خطوة زرار +</label>
            <input id="fStep" type="number" inputmode="numeric" value="${it&&it.step?it.step:""}" placeholder="١٠٠">
            <div class="hint">كل ضغطة تزوّد كام</div></div>
        </div>`;
      } else if (k === "ink"){
        kit = `<div class="grid2">
          <div class="field"><label>اللون</label>
            <input id="fColor" value="${esc(it?it.color:"")}" placeholder="أسود / أزرق / ملوّن"></div>
          <div class="field"><label>رقم الكاسيت</label>
            <input id="fModel" value="${esc(it?it.model:"")}" placeholder="مثال: UPP-110"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>العلبة تكفي كام صورة</label>
            <input id="fYield" type="number" inputmode="numeric" value="${it&&it.yield?it.yield:""}" placeholder="٢٠٠">
            <div class="hint">عشان نعرف تكلفة الصورة</div></div>
          <div class="field"><label>خطوة زرار +</label>
            <input id="fStep" type="number" inputmode="numeric" value="${it&&it.step?it.step:""}" placeholder="١">
            <div class="hint">للعلب: ١</div></div>
        </div>`;
      } else if (k === "chem"){
        kit = `<div class="grid2">
          <div class="field"><label>حجم العبوة (${esc(formUnit)})</label>
            <input id="fPack" type="number" inputmode="decimal" value="${it&&it.pack?it.pack:""}" placeholder="٥"></div>
          <div class="field"><label>خطوة زرار +</label>
            <input id="fStep" type="number" inputmode="numeric" value="${it&&it.step?it.step:""}" placeholder="١"></div>
        </div>`;
      } else {
        kit = `<div class="field"><label>خطوة زرار +</label>
          <input id="fStep" type="number" inputmode="numeric" value="${it&&it.step?it.step:""}" placeholder="١"></div>`;
      }
      $("#fKit").innerHTML = kit;
    };
    $$("#fCats .pick").forEach(b => b.onclick = () => {
      formCat = b.dataset.c; $$("#fCats .pick").forEach(x => x.classList.toggle("on", x === b));
      buzz(6); drawUnits(); drawKit();
    });
    drawUnits(); drawKit();
    $("#fSave").onclick = () => {
      const name = $("#fName").value.trim();
      if (!name) return toast("اكتب اسم الصنف الأول");
      const obj = {
        name, code:$("#fCode").value.trim(), size:$("#fSize").value.trim(), cat:formCat, unit:formUnit,
        cost:+$("#fCost").value || 0, min:+$("#fMin").value || 0, max:+$("#fMax").value || 0,
        pack:+(($("#fPack")||{}).value) || 0, step:+(($("#fStep")||{}).value) || 0,
        color:(($("#fColor")||{}).value || "").trim(),
        model:(($("#fModel")||{}).value || "").trim(),
        yield:+(($("#fYield")||{}).value) || 0,
        lead:+$("#fLead").value || 0, exp:$("#fExp").value || "", note:$("#fNote").value.trim()
      };
      if (it){ Object.assign(it, obj); toast("اتحفظ"); }
      else {
        obj.id = uid(); obj.at = now(); obj.archived = false;
        S.items.push(obj);
        const op = +($("#fOpen")?.value || 0);
        if (op > 0) S.moves.push({ id:uid(), type:"in", itemId:obj.id, storeId:(S.stores.find(s=>s.main)||S.stores[0]).id, qty:op, price:obj.cost, date:todayISO(), note:"رصيد افتتاحي", at:now() });
        toast("الصنف اتضاف");
      }
      persist(); buzz(); closeSheet(); render();
    };
  });
}
function delItem(id){
  if (!need("edit")) return;
  const it = item(id); if (!it) return;
  const ms = S.moves.filter(m => m.itemId === id);
  const ds = S.deals.filter(d => d.itemId === id);
  const h = `<div class="card" style="background:var(--bad-soft);border-color:transparent">
      <div style="display:flex;gap:10px"><div style="color:var(--bad)">${svg("warn",20)}</div>
      <div style="font-size:13.5px;line-height:1.6">هتحذف <b>${esc(it.name)}</b> نهائياً${ms.length?` ومعاه <b>${n0(ms.length)}</b> حركة`:""}${ds.length?` و<b>${n0(ds.length)}</b> طلبية`:""}.

/* ---------- المرفقات ---------- */
const MAX_ATT = 1400000;                 /* ~1.4 مليون حرف base64 */
const fSize = (n) => n > 1048576 ? `${n1(n/1048576)} م.ب` : `${n0(n/1024)} ك.ب`;

/* يضغط الصور قبل ما تتخزّن — والملفات التانية بتتقرا زي ما هي */
function readAttachment(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(new Error("read"));
    r.onload = () => {
      const raw = r.result;
      const asIs = () => ({ name:file.name, type:file.type, data:raw, size:raw.length });
      if (!/^image\//.test(file.type)) return res(asIs());
      const img = new Image();
      let done = false;
      const ok = (v) => { if (!done){ done = true; res(v); } };
      setTimeout(() => ok(asIs()), 4000);     /* حارس زي اللوجو */
      img.onerror = () => ok(asIs());
      img.onload = () => {
        try{
          const MAXD = 1400, sc = Math.min(1, MAXD / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.width * sc));
          c.height = Math.max(1, Math.round(img.height * sc));
          const ctx = c.getContext("2d");
          if (!ctx) return ok(asIs());
          ctx.drawImage(img, 0, 0, c.width, c.height);
          const out = c.toDataURL("image/jpeg", 0.72);
          const best = out.length < raw.length ? out : raw;
          ok({ name:file.name, type: best === out ? "image/jpeg" : file.type, data:best, size:best.length });
        }catch(e){ ok(asIs()); }
      };
      img.src = raw;
    };
    r.readAsDataURL(file);
  });
}
/* اختيار ملف — لازم الـinput يبقى جوّه الصفحة فعلاً،
   لأن سفاري على الآيفون بيتجاهل أي input متعمول بالـJS ومش متضاف للـDOM */
function pickFile(accept){
  return new Promise(resolve => {
    const inp = document.createElement("input");
    inp.type = "file";
    if (accept) inp.accept = accept;
    inp.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;z-index:-1";
    document.body.appendChild(inp);
    let done = false;
    const finish = (f) => {
      if (done) return; done = true;
      setTimeout(() => { try{ inp.remove(); }catch(e){} }, 300);
      resolve(f || null);
    };
    inp.addEventListener("change", () => finish(inp.files && inp.files[0]));
    inp.addEventListener("cancel", () => finish(null));
    /* لو المستخدم قفل شاشة الاختيار من غير ما يختار */
    const onBack = () => {
      window.removeEventListener("focus", onBack);
      setTimeout(() => { if (!inp.files || !inp.files.length) finish(null); }, 900);
    };
    setTimeout(() => window.addEventListener("focus", onBack), 400);
    inp.click();
  });
}

/* اللوجو بيتصغّر لمربع ٢٥٦ عشان ميكبّرش حجم البيانات */
function readLogo(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    let done = false;
    const ok = (v) => { if (!done){ done = true; res(v); } };
    r.onerror = () => { if (!done){ done = true; rej(new Error("read")); } };
    r.onload = () => {
      const raw = r.result;
      const img = new Image();
      setTimeout(() => ok(raw), 4000);        /* حارس: لو الصورة معرفتش تتفك */
      img.onerror = () => ok(raw);
      img.onload = () => {
        try{
          const D = 256, c = document.createElement("canvas");
          c.width = D; c.height = D;
          const ctx = c.getContext("2d");
          if (!ctx) return ok(raw);
          const side = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, D, D);
          const out = c.toDataURL("image/jpeg", 0.8);
          ok(out.length < raw.length ? out : raw);
        }catch(e){ ok(raw); }
      };
      img.src = raw;
    };
    r.readAsDataURL(file);
  });
}
function attBoxHTML(){
  if (!mfFile) return `<button class="att-add" id="attBtn">${svg("clip")} إرفاق صورة أو ملف</button>
    <div class="hint">صورة إذن الصرف، الفاتورة، أو أي مستند — بيتحفظ جوه البرنامج.</div>`;
  const isImg = /^image\//.test(mfFile.type);

}

      el.innerHTML = `الرصيد بعد الحركة <b style="color:${after<=0?"var(--bad)":"var(--ok)"}">${n1(after)}</b> ${esc(it?it.unit:"")}${packTxt(it,after)}`
        + (deal ? ` · الطلبية هيبقى فيها <b>${n1(dealRemaining(deal)-v)}</b>` : "");

    }
  }

  function saveMove(){
    const qty = +$("#mvQty").value || 0;
    const date = $("#mvDate").value || todayISO();
    const storeId = $("#mvStore").value;
    const avail = balance(mfItem, storeId);
    const m = { id:uid(), type:mfType, itemId:mfItem, storeId, date, note:$("#mvNote").value.trim(), at:now() };

    if (mfType === "adjust"){
      const before = balance(mfItem, storeId, date);
      m.delta = qty - before; m.qty = Math.abs(m.delta); m.after = qty;
      if (m.delta === 0) return toast("مفيش فرق يتسجّل");
    } else {
      if (qty <= 0) return toast("اكتب كمية أكبر من صفر");
      if (takes && qty > avail) return toast(`المتاح ${n1(avail)} ${item(mfItem)?.unit||""} بس في ${strOf(storeId)?.name||"المخزن"}`);
      m.qty = qty;
    }
    if (mfType === "move"){
      m.toStoreId = $("#mvTo").value;
      if (m.toStoreId === storeId) return toast("اختار مخزن مختلف");
    }
    if ($("#mvParty")) m.partyId = $("#mvParty").value || "";
    if ($("#mvDeal") && $("#mvDeal").value){
      const d = S.deals.find(x => x.id === $("#mvDeal").value);
      if (d && qty > dealRemaining(d)) return toast(`الطلبية باقي فيها ${n1(dealRemaining(d))} بس`);
      m.dealId = $("#mvDeal").value;
    }
    if ($("#mvPrice")) m.price = +$("#mvPrice").value || 0;
    if ($("#mvRef")) m.ref = $("#mvRef").value.trim();
    if (mfType === "in"){
      m.pay = mfPay;
      m.paid = mfPay === "cash" ? (m.price || 0) * qty : (mfPay === "part" ? (+($("#mvPaid") ? $("#mvPaid").value : 0) || 0) : 0);
    }
    if (typeof ME !== "undefined" && ME) m.by = ME.id;
    if (mfFile) m.file = mfFile;

    S.moves.push(m); persist();
    try{ if (JSON.stringify(S).length > 4200000) toast("المساحة قربت تخلص — صدّر نسخة واحذف مرفقات قديمة"); }catch(e){} buzz(18); closeSheet(); render();
    const t2 = MOVES[m.type];
    if (m.dealId){
      const d = S.deals.find(x => x.id === m.dealId);
      if (d && dealRemaining(d) <= 0) return toast(`الطلبية اكتملت بالكامل 🎉 — رصيد المخزن ${n1(balance(mfItem))}`);
      return toast(`اتسلّم ${n1(qty)} — باقي في الطلبية ${n1(dealRemaining(d))} · المخزن ${n1(balance(mfItem))}`);
    }
    if (m.type === "in" && m.partyId && m.price){
      const rest = (m.price * m.qty) - (m.paid || 0);
      return toast(rest > 0 ? `اتسجّلت — ${money(rest)} على الحساب` : `اتسجّلت واتدفعت ${money(m.price*m.qty)}`);
    }
    toast(`${t2.ar} ${n1(m.qty)} ${item(mfItem)?.unit||""} — الرصيد ${n1(balance(mfItem))}`);
  }
}

function openAttachment(id){
  const m = S.moves.find(x => x.id === id); if (!m || !m.file) return;
  const w = window.open("", "_blank");
  if (!w) return toast("اسمح بفتح نافذة جديدة");
  if (/^image\//.test(m.file.type)){
    w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>${esc(m.file.name)}</title>
      <style>body{margin:0;background:#0B0B0C;display:grid;place-items:center;min-height:100vh}img{max-width:100%;height:auto}</style>
      </head><body><img src="${m.file.data}"></body></html>`);
    w.document.close();
  } else {
    w.location = m.file.data;
  }
}
function saveAttachment(id){
  const m = S.moves.find(x => x.id === id); if (!m || !m.file) return;
  const a = document.createElement("a");
  a.href = m.file.data; a.download = m.file.name || "attachment";
  document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 300);
  toast("اتحفظ");
}

function dl(name, text, mime){
  const b = new Blob(["\ufeff" + text], { type: mime || "application/json;charset=utf-8" });
  const u = URL.createObjectURL(b), a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 400);
}
function doExport(){

async function doImport(){
  const f = await pickFile(".json,application/json");
  if (!f) return;
  {
    const r = new FileReader();
    r.onload = () => {

function doCSV(){
  const head = ["التاريخ","النوع","الصنف","الكود","المقاس","الوحدة","الكمية","بالعلب","المخزن","إلى مخزن","الجهة","السعر","الإجمالي","فاتورة","ملاحظة","مرفق"];
  const q = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const lines = [head.map(q).join(",")];
  S.moves.slice().sort((a,b) => a.date < b.date ? -1 : 1).forEach(m => {
    const it = item(m.itemId), t = MOVES[m.type];
    const qty = m.type === "adjust" ? m.delta : t.sign * m.qty;
    lines.push([m.date, t.ar, it?it.name:"", it?it.code:"", it?it.size:"", it?it.unit:"", qty, isSheet(it)?(qty/it.pack):"",
      strOf(m.storeId)?.name||"", strOf(m.toStoreId)?.name||"", party(m.partyId)?.name||"",
      m.price||"", m.price?(m.price*m.qty):"", m.ref||"", m.note||"", m.file?m.file.name:""].map(q).join(","));
  });
  dl(`mystock-moves-${todayISO()}.csv`, lines.join("\n"), "text/csv;charset=utf-8");
  toast("ملف CSV جاهز");
}

/* =========================================================
   الحسابات والصلاحيات — أول تشغيل بيعمل حساب المدير، وبعدها login
   ========================================================= */
const ROLES = {
  admin: { ar:"مدير",       tint:"var(--bad)",  d:"كل الصلاحيات + إدارة المستخدمين والمشتريات" },
  stock: { ar:"أمين مخزن",  tint:"var(--ok)",   d:"وارد وصرف وجرد وأصناف وموردين وتقارير" },
  tech:  { ar:"موظف",       tint:"var(--info)", d:"صرف وتسليم للمراكز وعرض البيانات بس" },
};
let ME = null;

async function sha(text){
  try{
    if (typeof crypto !== "undefined" && crypto.subtle){
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  let a = 0x811c9dc5, b = 0x01000193;
  for (let i = 0; i < text.length; i++){
    const c = text.charCodeAt(i);
    a = Math.imul(a ^ c, 16777619) >>> 0;
    b = (Math.imul(b + c, 2246822519) ^ (b >>> 13)) >>> 0;
  }
  return (a>>>0).toString(16).padStart(8,"0") + (b>>>0).toString(16).padStart(8,"0");
}
const uname = (v) => String(v||"").trim().toLowerCase();
async function makeUser(user, name, role, pass){
  const salt = uid() + uid();
  return { id:uid(), user:uname(user), name:name.trim(), role, salt, hash:await sha(salt + pass), active:true, at:now() };
}
async function checkPass(u, pass){ return !!u && u.hash === await sha(u.salt + pass); }
function can(x){
  if (!ME) return false;
  if (ME.role === "admin") return true;
  if (x === "admin") return false;
  if (x === "edit")  return ME.role === "stock";
  if (x === "issue") return ME.role === "stock" || ME.role === "tech";
  return false;
}

      if (p1 !== p2) return err("كلمتين السر مش زي بعض");
      const u = await makeUser(user, name, "admin", p1);
      S.users.push(u); persist();
      signIn(u);
    };
    setTimeout(() => { const el = $("#suName"); if (el && el.focus) el.focus(); }, 350);
    return;
  }

  box.innerHTML = `${brand}
    <div class="auth-title"><h2>${esc(bizName)}</h2><p>سجّل دخولك عشان تكمّل</p></div>
    <div class="field"><label>اسم المستخدم</label><input id="lgUser" autocapitalize="off" placeholder="اسم المستخدم"></div>
    <div class="field"><label>كلمة السر</label><input id="lgPass" type="password" placeholder="••••••"></div>
    <button class="btn wide" id="lgGo">${svg("lock",16)} دخول</button>
    <div id="authMsg" class="hint" style="text-align:center;margin-top:10px;color:var(--bad)"></div>
    <div class="mut2" style="text-align:center;font-size:11.5px;margin-top:18px">${n0(S.users.filter(u=>u.active!==false).length)} مستخدم على الجهاز ده</div>`;
  const go = async () => {
    const u = S.users.find(x => x.user === uname($("#lgUser").value) && x.active !== false);
    if (!await checkPass(u, $("#lgPass").value)){
      $("#authMsg").textContent = "اسم المستخدم أو كلمة السر غلط";
      $("#authBox").classList.add("shake"); buzz(60);
      setTimeout(() => $("#authBox").classList.remove("shake"), 520);
      return;
    }
    signIn(u);
  };
  $("#lgGo").onclick = go;
  $("#lgPass").onkeydown = e => { if (e.key === "Enter") go(); };
}
function signIn(u){
  ME = u;
  try{ localStorage.setItem(UKEY, u.id); }catch(e){}
  $("#auth").classList.remove("on");
  document.body.style.overflow = "";
  buzz(18); applyRole(); render();
  toast(`أهلاً ${u.name.split(" ")[0]} 👋`);
}
function signOut(){
  try{ localStorage.removeItem(UKEY); }catch(e){}
  ME = null; closeSheet();
  $("#auth").classList.add("on");
  authView("login");
}
function applyRole(){
  const w = $("#whoBox");
  if (w && ME){
    w.innerHTML = `<span class="av" style="background:${avColor(ME)}">${esc(avText(ME))}</span><span class="nm">${esc(ME.name.split(" ")[0])}</span>`;
    w.classList.remove("hide");
  }
  const f = $("#fab"); if (f) f.classList.toggle("hide", !can("issue"));
}
function bootAuth(){
  if (!S.users.length){ $("#auth").classList.add("on"); authView("setup"); return; }
  let sid = null; try{ sid = localStorage.getItem(UKEY); }catch(e){}
  const saved = sid ? S.users.find(u => u.id === sid && u.active !== false) : null;
  if (saved){ ME = saved; applyRole(); }
  else { $("#auth").classList.add("on"); authView("login"); }
}

/* =========================================================
   المساعد الذكي — بيرد من بيانات البرنامج نفسه، بدون نت
   ========================================================= */
function askAnswers(){
  const t = todayISO(), m30 = addDays(t,-29), m7 = addDays(t,-6);
  const live = S.items.filter(i => !i.archived);
  const rows = live.map(i => ({ it:i, b:balance(i.id), cv:coverage(i.id), a:avgDaily(i.id) }));
  const Q = [];
  const money0 = (v) => money(v);

  /* ١ — إيه اللي محتاج طلبية */
  Q.push({ q:"إيه اللي محتاج أطلبه دلوقتي؟", ic:"down", tint:"var(--bad)", key:"طلب اطلب اشتري ناقص محتاج",
    a(){
      const need = rows.filter(x => x.cv !== Infinity && x.cv <= 30).sort((a,b) => a.cv - b.cv);
      if (!need.length) return { t:"مفيش حاجة مستعجلة 👌", d:"كل الأصناف تغطيتها أكتر من شهر." };
      return { t:`${n0(need.length)} صنف محتاج طلبية`, d:need.slice(0,6).map(x => {
        let sug = Math.max(x.it.min||0, Math.ceil(x.a*45));
        if (isSheet(x.it)) sug = Math.ceil(sug/x.it.pack)*x.it.pack;
        return `• ${x.it.name}: فاضل ${n1(x.b)} ${x.it.unit} (يكفي ${n0(x.cv)} يوم) — اطلب حوالي ${n0(sug)}`;
      }).join("\n"), go:()=>go("reports") };
    }});

  /* ٢ — أول صنف هيخلص */
  Q.push({ q:"إمتى أول صنف هيخلص؟", ic:"clock", tint:"var(--acc)", key:"يخلص خلص متى امتى اقرب",
    a(){
      const r = rows.filter(x => x.cv !== Infinity).sort((a,b) => a.cv - b.cv)[0];
      if (!r) return { t:"لسه مفيش استهلاك مسجّل", d:"سجّل عمليات صرف الأول عشان نقدر نتوقّع." };
      const d = Math.floor(r.cv);
      return { t:`${r.it.name} — ${fDateFull(addDays(t,d))}`,
        d:`فاضل ${n1(r.b)} ${r.it.unit}، وبتصرف ${n1(r.a)} في اليوم.${r.it.lead?`\nمدة التوريد ${n0(r.it.lead)} يوم، يعني اطلب قبل ${fDate(addDays(t, Math.max(0,d-r.it.lead)))}.`:""}`,
        go:()=>openItem(r.it.id) };
    }});

  /* ٣ — كام ورقة عندي */
  Q.push({ q:"عندي كام ورقة في المخزن؟", ic:"box", tint:"var(--c-thermal)", key:"ورق ورقة كمية رصيد عندي كام",
    a(){
      const sheets = live.filter(i => SHEETY.includes(i.unit));
      const tot = sheets.reduce((x,i) => x + Math.max(0,balance(i.id)), 0);
      if (!tot) return { t:"مفيش ورق مسجّل", d:"ضيف أصناف الورق وسجّل الوارد." };
      return { t:`${n0(tot)} ورقة`, d:sheets.filter(i => balance(i.id) > 0)
        .sort((a,b) => balance(b.id)-balance(a.id))
        .map(i => `• ${i.name}: ${n1(balance(i.id))}${isSheet(i)?` (${n1(balance(i.id)/i.pack)} علبة)`:""}`).join("\n"),
        go:()=>go("stock") };
    }});

  /* ٤ — بصرف كام في اليوم */
  Q.push({ q:"بصرف كام في اليوم؟", ic:"chart", tint:"var(--c-film)", key:"استهلاك بصرف متوسط يومي معدل",
    a(){
      const q30 = consumedBetween(null, m30, t), q7 = consumedBetween(null, m7, t);
      if (!q30) return { t:"مفيش صرف في آخر شهر", d:"مفيش حركات منصرف مسجّلة." };
      const diff = q7/7 - q30/30;
      return { t:`${n1(q30/30)} في المتوسط`,
        d:`آخر ٣٠ يوم: ${n1(q30)}\nآخر ٧ أيام: ${n1(q7)} (بمعدل ${n1(q7/7)} يومياً)\n${
          Math.abs(diff) < 0.05*(q30/30 || 1) ? "المعدل ثابت تقريباً." :
          diff > 0 ? `الاستهلاك زايد الأسبوع ده بحوالي ${n0((diff/(q30/30))*100)}٪.` :
                     `الاستهلاك قلّ الأسبوع ده بحوالي ${n0((-diff/(q30/30))*100)}٪.`}`,
        go:()=>go("reports") };
    }});

  /* ٥ — قيمة المخزون */
  Q.push({ q:"قيمة المخزون كام؟", ic:"calc", tint:"var(--ok)", key:"قيمة فلوس مبلغ تكلفة المخزون",
    a(){
      const v = stockValue();
      const byCat = Object.entries(CATS).map(([k,c]) => ({ n:c.ar,
        v: live.filter(i => i.cat === k).reduce((x,i) => x + Math.max(0,balance(i.id))*(i.cost||0), 0) }))
        .filter(x => x.v > 0).sort((a,b) => b.v - a.v);
      return { t:money0(v), d:byCat.length ? byCat.map(x => `• ${x.n}: ${money0(x.v)}`).join("\n") : "ضيف أسعار للأصناف عشان نحسب القيمة." };
    }});

  /* ٦ — عليّ كام للموردين */
  Q.push({ q:"عليّ كام للموردين؟", ic:"truck", tint:"var(--warn)", key:"مورد موردين مستحق فلوس دين اجل عليا",
    a(){
      const T = supTotals();
      if (!T.total) return { t:"مفيش مشتريات مسجّلة", d:"سجّل فواتير الشراء من المخزون ← الموردين." };
      const due = suppliers().map(p => ({ p, st:supStats(p.id) })).filter(x => x.st.due > 0).sort((a,b) => b.st.due - a.st.due);
      return { t:T.due > 0 ? money0(T.due) : "مفيش مديونية 👌",
        d:due.length ? due.map(x => `• ${x.p.name}: ${money0(x.st.due)}`).join("\n")
          : `إجمالي المشتريات ${money0(T.total)} واتدفعت كلها.`,
        go:()=>{ stockTab = "sup"; go("stock"); } };
    }});

  /* ٧ — المراكز */
  Q.push({ q:"باقي إيه على المراكز؟", ic:"center", tint:"var(--c-plastic)", key:"مركز مراكز طلبية باقي تسليم عميل",
    a(){
      const cs = centers().map(p => ({ p, st:partyStats(p.id) })).filter(x => x.st.qty > 0);
      if (!cs.length) return { t:"مفيش طلبيات مسجّلة", d:"سجّل طلبية من تاب طلبيات المراكز." };
      const open = cs.filter(x => x.st.rem > 0).sort((a,b) => b.st.rem - a.st.rem);
      if (!open.length) return { t:"كل الطلبيات اتسلّمت ✅", d:cs.map(x => `• ${x.p.name}: اتسلّم ${n1(x.st.del)} بالكامل`).join("\n") };
      return { t:`${n0(open.length)} طلبية لسه مفتوحة`,
        d:open.map(x => `• ${x.p.name}: باقي ${n1(x.st.rem)} من ${n1(x.st.qty)}`).join("\n"),
        go:()=>go("centers") };
    }});

  /* ٨ — أكتر صنف بيتصرف */
  Q.push({ q:"أكتر صنف بستهلكه إيه؟", ic:"up", tint:"var(--c-photo)", key:"اكتر اعلى صنف استهلاك بيتصرف",
    a(){
      const top = live.map(i => ({ i, q:consumedBetween(i.id, m30, t) })).filter(x => x.q > 0).sort((a,b) => b.q - a.q);
      if (!top.length) return { t:"مفيش صرف في آخر شهر", d:"" };
      const tot = top.reduce((x,y) => x + y.q, 0);
      return { t:`${top[0].i.name} — ${n1(top[0].q)} ${top[0].i.unit}`,
        d:top.slice(0,5).map(x => `• ${x.i.name}: ${n1(x.q)} (${n0((x.q/tot)*100)}٪)`).join("\n"),
        go:()=>openItem(top[0].i.id) };
    }});

  /* ٩ — تكلفة اليوم */
  Q.push({ q:"الصرف بيكلّفني كام في الشهر؟", ic:"wallet", tint:"var(--info)", key:"تكلفة كلفة شهر فلوس صرف",
    a(){
      let c = 0;
      for (const i of live) c += consumedBetween(i.id, m30, t) * (i.cost || 0);
      if (!c) return { t:"مفيش تكلفة محسوبة", d:"ضيف سعر الوحدة للأصناف عشان نحسب." };
      return { t:money0(c), d:`ده تكلفة اللي اتصرف آخر ٣٠ يوم.\nبمتوسط ${money0(c/30)} في اليوم.` };
    }});

  /* ١٠ — فيه مشاكل؟ */
  Q.push({ q:"فيه أي مشاكل في المخزن؟", ic:"warn", tint:"var(--bad)", key:"مشكلة مشاكل تنبيه خطر سالب",
    a(){
      const A = alerts();
      if (!A.length) return { t:"كله تمام ✅", d:"مفيش أي تنبيهات دلوقتي." };
      return { t:`${n0(A.length)} تنبيه`, d:A.slice(0,7).map(x => `• ${x.t}`).join("\n"), go:()=>openAlerts() };
    }});

  /* ١١ — آخر حركات */
  Q.push({ q:"إيه آخر اللي حصل؟", ic:"clock", tint:"var(--ink2)", key:"اخر حركات نشاط حصل امبارح النهاردة",
    a(){
      const ms = S.moves.slice().sort((a,b) => (b.at||0)-(a.at||0)).slice(0,7);
      if (!ms.length) return { t:"مفيش حركات لسه", d:"" };
      return { t:`آخر ${n0(ms.length)} حركة`,
        d:ms.map(m => { const it = item(m.itemId), ty = MOVES[m.type];
          return `• ${ty.ar} ${n1(m.qty)} ${it?it.unit:""} ${it?it.name:""} — ${relDay(m.date)}${m.by&&byName(m.by)?` (${byName(m.by).split(" ")[0]})`:""}`;
        }).join("\n"), go:()=>go("moves") };
    }});

  /* ١٢ — كام علبة */
  Q.push({ q:"الرصيد ده كام علبة؟", ic:"box", tint:"var(--c-misc)", key:"علبة علب تحويل كام",
    a(){
      const sh = live.filter(i => isSheet(i) && balance(i.id) > 0);
      if (!sh.length) return { t:"مفيش أصناف متسجّل ليها عدد أوراق في العلبة", d:"اكتب «عدد الأوراق في العلبة» في بيانات الصنف." };
      return { t:"التحويل للعلب", d:sh.map(i => `• ${i.name}: ${n1(balance(i.id))} ورقة = ${n1(balance(i.id)/i.pack)} علبة`).join("\n") };
    }});

  return Q;
}

let askOpen = -1, askQ = "";
function renderAsk(){
  const Q = askAnswers();
  const q = askQ.trim();
  const norm = (v) => String(v||"").replace(/[أإآ]/g,"ا").replace(/[ىي]/g,"ي").replace(/ة/g,"ه").replace(/[ًٌٍَُِّْ]/g,"");
  const nq = norm(q);
  const list = q ? Q.filter(x => {
    if (norm(x.q).includes(nq)) return true;
    return norm(x.key||"").split(/\s+/).some(k => k && (k.includes(nq) || nq.includes(k)));
  }) : Q;

  const body = `
  <div class="card" style="background:linear-gradient(150deg,var(--hero-1),var(--hero-2));border-color:transparent;color:#fff">
    <div style="display:flex;align-items:center;gap:11px">

/* =========================================================
   الموردين والمشتريات
   عملية الشراء = حركة «وارد» عليها مورد وطريقة دفع.
   مفيش تسجيل مزدوج — نفس الحركة بتزوّد المخزن وبتبني حساب المورد.
   ========================================================= */
const PAYW = {
  cash:   { ar:"كاش",       tint:"var(--ok)",   ic:"wallet" },
  credit: { ar:"آجل",       tint:"var(--warn)", ic:"clock" },
  part:   { ar:"دفعة مقدّمة",tint:"var(--info)", ic:"calc" },
};
const PAY_METHODS = ["كاش", "تحويل بنكي", "شيك", "محفظة إلكترونية"];

const suppliers = () => S.parties.filter(p => p.kind === "sup");
const purchases = (pid) => S.moves.filter(m => m.type === "in" && m.partyId && (!pid || m.partyId === pid));
const purchaseTotal = (m) => (m.price || 0) * (m.qty || 0);
const purchasePaid = (m) => {
  if (m.pay === "cash") return purchaseTotal(m);
  if (m.pay === "part") return Math.min(purchaseTotal(m), m.paid || 0);
  return 0;                                   /* آجل */
};
const supPays = (pid) => (S.pays || []).filter(p => p.partyId === pid);

function supStats(pid){
  const ms = purchases(pid);
  const total = ms.reduce((a,m) => a + purchaseTotal(m), 0);
  const onInvoice = ms.reduce((a,m) => a + purchasePaid(m), 0);
  const extra = supPays(pid).reduce((a,p) => a + (p.amount || 0), 0);
  const paid = onInvoice + extra;
  const qty = ms.reduce((a,m) => a + (m.qty || 0), 0);
  const last = ms.slice().sort((a,b) => a.date < b.date ? 1 : -1)[0];
  return { ms, total, paid, due: Math.max(0, total - paid), qty, count: ms.length, last: last ? last.date : "" };
}
function supTotals(){
  let total = 0, paid = 0;
  for (const p of suppliers()){ const s = supStats(p.id); total += s.total; paid += s.paid; }
  return { total, paid, due: Math.max(0, total - paid) };
}

/* =========================================================
   المزامنة بين الأجهزة — اختيارية، بتشتغل لما يكون في سيرفر
   ========================================================= */
const SYNC_KINDS = ["items","stores","parties","moves","deals","pays","users"];
const SESS_KEY = "mystock.sync.v1";
const CFG_SYNCED = ["biz","sub","covWarn","covBad","avgWindow"];
let TOKEN = null, UID = null, UNAME = "", SINCE = 0, PUSHED = 0;
let SHADOW = {}, CFGSIG = "", SYNCING = false, LASTSYNC = 0, SYNC_ERR = "";
let SERVER_OK = null;   /* null = لسه مجرّبناش */

function saveSess(){
  try{ localStorage.setItem(SESS_KEY, JSON.stringify({ t:TOKEN, u:UID, n:UNAME, s:SINCE, p:PUSHED })); }catch(e){}
}
function loadSess(){

    const d = JSON.parse(localStorage.getItem(SESS_KEY) || "null");
    if (d){ TOKEN = d.t || null; UID = d.u || null; UNAME = d.n || ""; SINCE = d.s || 0; PUSHED = d.p || 0; }
  }catch(e){}
}
function clearSess(){
  TOKEN = UID = null; UNAME = ""; SINCE = PUSHED = 0;
  try{ localStorage.removeItem(SESS_KEY); }catch(e){}
}

async function api(path, body){
  const h = { "Content-Type":"application/json" };
  if (TOKEN) h.Authorization = "Bearer " + TOKEN;
  const r = await fetch("/api/" + path, { method:"POST", headers:h, body: JSON.stringify(body || {}) });
  let j = {};
  try{ j = await r.json(); }catch(e){}
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}
async function serverAlive(){
  try{
    const r = await fetch("/healthz", { cache:"no-store" });
    SERVER_OK = r.ok;
  }catch(e){ SERVER_OK = false; }
  return SERVER_OK;
}

/* بصمة السجل — من غير الطابع الزمني ومن غير محتوى المرفق */
function sigOf(o){
  const s = JSON.stringify(o, (k,v) => k === "u" ? undefined : (k === "data" && typeof v === "string" ? "L"+v.length : v));
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36) + ":" + s.length;
}
function cfgSlice(){
  const o = {}; CFG_SYNCED.forEach(k => { o[k] = S.cfg[k]; }); return o;
}

/* بيرصد الإضافة والتعديل والحذف لوحده من غير ما نلمس كل مكان بيكتب */
function stampChanges(){
  const t = now();
  if (!S.tombs) S.tombs = {};
  for (const k of SYNC_KINDS){
    const arr = S[k] || [];
    const sh = SHADOW[k] = SHADOW[k] || {};
    const seen = new Set();
    for (const r of arr){
      if (!r.id) r.id = uid();
      seen.add(r.id);
      const sg = sigOf(r);
      if (sh[r.id] !== sg){ r.u = t; sh[r.id] = sg; }
    }
    for (const id of Object.keys(sh)){
      if (!seen.has(id)){
        delete sh[id];
        (S.tombs[k] = S.tombs[k] || {})[id] = t;
      }
    }
  }
  const cs = sigOf(cfgSlice());
  if (CFGSIG && cs !== CFGSIG) S.cfgU = t;
  CFGSIG = cs;
}
function rebuildShadow(){
  SHADOW = {};
  for (const k of SYNC_KINDS){
    SHADOW[k] = {};
    for (const r of (S[k] || [])) if (r.id) SHADOW[k][r.id] = sigOf(r);
  }
  CFGSIG = sigOf(cfgSlice());
}

function mergeIn(list){
  let changed = false;
  for (const rec of list){
    const k = rec.kind;
    if (!SYNC_KINDS.includes(k)) continue;
    S[k] = S[k] || [];
    const i = S[k].findIndex(x => x.id === rec.id);
    if (rec.deleted){
      if (i >= 0){ S[k].splice(i,1); changed = true; }
      (S.tombs[k] = S.tombs[k] || {})[rec.id] = rec.u;
      continue;
    }
    let obj; try{ obj = JSON.parse(rec.data); }catch(e){ continue; }
    obj.u = rec.u;
    if (i < 0){ S[k].push(obj); changed = true; }
    else if ((S[k][i].u || 0) < rec.u){ S[k][i] = obj; changed = true; }
  }
  return changed;
}

async function syncNow(loud){
  if (!TOKEN || SYNCING) return false;
  if (typeof navigator !== "undefined" && navigator.onLine === false){ if (loud) toast("مفيش نت دلوقتي"); return false; }
  SYNCING = true; SYNC_ERR = ""; paintSync();
  let wasPending = 0;
  try{
    stampChanges();
    wasPending = pendingCount();
    const recs = [];
    for (const k of SYNC_KINDS){
      for (const r of (S[k] || [])) if ((r.u || 0) > PUSHED) recs.push({ kind:k, id:r.id, u:r.u, data:JSON.stringify(r) });
      const tb = (S.tombs || {})[k] || {};
      for (const id of Object.keys(tb)) if (tb[id] > PUSHED) recs.push({ kind:k, id, u:tb[id], deleted:1 });
    }
    const prof = (S.cfgU || 0) > PUSHED ? { u:S.cfgU, data:JSON.stringify(cfgSlice()) } : null;
    const res = await api("sync", { since:SINCE, records:recs, profile:prof });

    let changed = mergeIn(res.records || []);
    if (res.profile && (res.profile.u || 0) > (S.cfgU || 0)){
      try{
        const p = JSON.parse(res.profile.data);
        CFG_SYNCED.forEach(k => { if (p[k] !== undefined) S.cfg[k] = p[k]; });
        S.cfgU = res.profile.u; changed = true;
      }catch(e){}
    }
    PUSHED = res.now;
    SINCE = Math.max(0, res.now - 15000);
    LASTSYNC = Date.now();
    saveSess();
    if (changed){
      rebuildShadow(); persist();
      if (!ME && S.users.length && $("#auth").classList.contains("on") && $("#suUser")){
        authView("login");
        toast(`اتسحب ${n0(S.users.length)} حساب — سجّل دخولك`);
      }
      if (ME){
        const fresh = S.users.find(u => u.id === ME.id);
        if (!fresh || fresh.active === false) return signOut();
        ME = fresh; applyRole();
      }
      const busy = $("#sheet").classList.contains("on");
      if (!busy) render();
    } else persist();
    SYNCING = false; paintSync();
    if (loud) toast(changed ? "اتزامن — فيه بيانات جديدة" : "كله متزامن ✅");
    return true;
  }catch(e){
    SYNC_ERR = e.message || "خطأ";
    SYNCING = false; paintSync();
    if (loud) toast("المزامنة فشلت — " + SYNC_ERR);
    if (/401|403/.test(SYNC_ERR)){ clearSess(); render(); }
    return false;
  }
}

let syncDebounce = null;
function syncSoon(){ if (!TOKEN) return; clearTimeout(syncDebounce); syncDebounce = setTimeout(() => syncNow(false), 900); }

function pendingCount(){
  let n = 0;
  for (const k of SYNC_KINDS) for (const r of (S[k] || [])) if ((r.u || 0) > PUSHED) n++;
  for (const k of Object.keys(S.tombs || {})) for (const id of Object.keys(S.tombs[k])) if (S.tombs[k][id] > PUSHED) n++;
  return n;
}
const isOffline = () => typeof navigator !== "undefined" && navigator.onLine === false;

/* حالة الاتصال — أيقونة واحدة صغيرة، من غير أي شريط بيقطع الشاشة */
function netState(){
  if (isOffline()) return { k:"off-line", ic:"cloudoff", t:"أوفلاين" };
  if (!TOKEN)      return { k:"on-line",  ic:"wifi",     t:"أونلاين" };
  if (SYNCING)     return { k:"busy",     ic:"cloud",    t:"بيزامن" };
  try{ stampChanges(); }catch(e){}
  return pendingCount() > 0
    ? { k:"pending", ic:"cloud", t:"في انتظار الرفع" }
    : { k:"on-line", ic:"cloudok", t:"متزامن" };
}
function paintNet(){
  const b = $("#btnNet"); if (!b) return;
  const st = netState();
  b.classList.remove("on-line","off-line","pending","busy");
  b.classList.add(st.k);
  $("#netIc").innerHTML = svg(st.ic);
  b.setAttribute("aria-label", "حالة الاتصال: " + st.t);
}
function openNet(){
  const off = isOffline(), n = TOKEN ? pendingCount() : 0;
  const st = netState();
  const line = (ic, tint, t, d) => `<div class="row" style="padding:10px 0">
    <div class="ic" style="--tint:${tint}">${svg(ic)}</div>
    <div class="mid"><div class="t">${t}</div><div class="d" style="white-space:normal">${d}</div></div></div>`;

  let body = `<div class="card" style="text-align:center;padding:20px">
      <div style="width:58px;height:58px;border-radius:20px;margin:0 auto 10px;display:grid;place-items:center;
        background:${off?"var(--surf2)":st.k==="pending"?"var(--warn-soft)":"var(--ok-soft)"};
        color:${off?"var(--ink3)":st.k==="pending"?"var(--warn)":"var(--ok)"}">${svg(st.ic,26)}</div>
      <div class="dsp" style="font-size:19px">${off?"مفيش نت":TOKEN?(n?`${n0(n)} تغيير مستني`:"كل حاجة متزامنة"):"أونلاين"}</div>
      <div class="mut" style="font-size:12.5px">${off?"البرنامج شغّال عادي والشغل بيتحفظ":TOKEN?(LASTSYNC?`آخر مزامنة ${relTime(LASTSYNC)}`:"لسه متزامنش"):"المزامنة مش مشغّلة"}</div>
    </div>
    <div class="card"><div class="rows">
      ${line("save","var(--ok)","الشغل محفوظ دايماً","كل حاجة بتتسجّل على الجهاز أول بأول، بنت أو من غيره.")}
      ${TOKEN
        ? line("cloud", n?"var(--warn)":"var(--ok)", n?`${n0(n)} تغيير في الطابور`:"مفيش حاجة مستنية",
            n?"هيترفعوا لوحدهم أول ما النت يرجع.":"كل التغييرات وصلت للسيرفر.")
        : line("cloud","var(--ink3)","المزامنة مقفولة","شغّلها عشان نفس البيانات تبقى على كل أجهزتك.")}
    </div></div>`;

  if (TOKEN && !off) body += `<button class="btn wide" id="ntGo">${svg("refresh",16)} زامن دلوقتي</button>`;
  else if (!TOKEN) body += `<button class="btn wide" id="ntSync">${svg("cloud",16)} شغّل المزامنة</button>`;
  body += `<div style="height:10px"></div>`;

  sheet("حالة الاتصال", body, () => {
    if ($("#ntGo")) $("#ntGo").onclick = async () => { closeSheet(); await syncNow(true); };
    if ($("#ntSync")) $("#ntSync").onclick = () => { closeSheet(); setTimeout(openSync, 240); };
  });
}
function paintSync(){
  const w = $("#whoBox"); if (w && !ME) w.classList.add("hide");
  paintNet();
}

/* ---------- شاشة المزامنة ---------- */
function relTime(ts){
  if (!ts) return "لسه";
  const s = Math.round((Date.now()-ts)/1000);
  if (s < 60) return "من ثواني";
  if (s < 3600) return `من ${n0(Math.round(s/60))} دقيقة`;
  if (s < 86400) return `من ${n0(Math.round(s/3600))} ساعة`;
  return `من ${n0(Math.round(s/86400))} يوم`;
}
async function openSync(){
  await serverAlive();
  if (!SERVER_OK){
    return sheet("المزامنة", `<div class="empty"><div class="ic floaty">${svg("cloud",28)}</div>
      <h4>المزامنة مش متاحة هنا</h4>
      <p>النسخة دي شغّالة من ملف محلي. ارفع المشروع على Railway (أو أي سيرفر) وافتحه من اللينك، وساعتها هتقدر تسجّل حساب وتزامن بين الموبايل واللابتوب.</p>
      <div class="card tight" style="text-align:start;background:var(--surf2)"><div style="font-size:12.5px;line-height:1.7">البيانات دلوقتي محفوظة على الجهاز ده بس — استخدم «تصدير نسخة» لو عايز تنقلها.</div></div>
      </div><div style="height:10px"></div>`);
  }
  if (TOKEN){
    const cnt = SYNC_KINDS.reduce((a,k) => a + (S[k]||[]).length, 0);
    return sheet("المزامنة", `
      <div class="card" style="text-align:center;padding:20px">
        <div style="width:56px;height:56px;border-radius:19px;margin:0 auto 10px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)">${svg("cloud",26)}</div>
        <div class="dsp" style="font-size:18px">${esc(UNAME || "متزامن")}</div>
        <div class="mut" style="font-size:12.5px">آخر مزامنة ${relTime(LASTSYNC)} · ${n0(cnt)} سجل</div>
      </div>
      <div class="card tight" style="background:var(--info-soft);border-color:transparent"><div style="font-size:12.5px;line-height:1.7">
        سجّل الدخول بنفس الحساب على أي جهاز تاني وهتلاقي نفس البيانات. البيانات بتتحفظ محلياً برضه فالبرنامج بيشتغل من غير نت.</div></div>
      <button class="btn wide" id="syNow">${svg("refresh",16)} زامن دلوقتي</button>
      <button class="btn ghost wide sm" style="margin-top:9px" id="syOut">${svg("logout",14)} خروج من المزامنة</button>
      <div style="height:10px"></div>`, () => {
        $("#syNow").onclick = async () => { await syncNow(true); closeSheet(); };
        $("#syOut").onclick = () => { clearSess(); closeSheet(); render(); toast("خرجت — البيانات لسه على الجهاز"); };
      });
  }
  let mode = "login";
  const draw = () => {
    const isReg = mode === "register";
    sheet("المزامنة بين الأجهزة", `
      <div class="seg"><button class="${!isReg?"on":""}" data-m="login">دخول</button><button class="${isReg?"on":""}" data-m="register">حساب جديد</button></div>
      ${isReg?`<div class="field"><label>الاسم</label><input id="syName" placeholder="اسمك أو اسم الشركة"></div>`:""}
      <div class="field"><label>اسم المستخدم</label><input id="syUser" autocapitalize="off" placeholder="بالإنجليزي من غير مسافات"></div>
      <div class="field"><label>كلمة السر</label><input id="syPass" type="password" placeholder="٦ حروف على الأقل"></div>
      <div class="card tight" style="background:var(--warn-soft);border-color:transparent"><div style="font-size:12.5px;line-height:1.7">
        أول مزامنة هترفع البيانات اللي على الجهاز ده للسيرفر، وبعدها أي جهاز يدخل بنفس الحساب هيشوفها.</div></div>
      <button class="btn wide" id="syGo">${svg("cloud",16)} ${isReg?"اعمل حساب وزامن":"دخول وزامن"}</button>
      <div class="hint" id="syMsg" style="text-align:center;margin-top:10px;color:var(--bad)"></div>
      <div style="height:10px"></div>`, () => {
      $$("#sheetBody [data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; buzz(6); draw(); });
      $("#syGo").onclick = async () => {
        const user = $("#syUser").value.trim().toLowerCase(), pass = $("#syPass").value;
        const name = isReg ? $("#syName").value.trim() : "";
        const err = m => { $("#syMsg").textContent = m; buzz(50); };
        if (user.length < 3) return err("اسم المستخدم ٣ حروف على الأقل");
        if (pass.length < 6) return err("كلمة السر ٦ حروف على الأقل");
        $("#syGo").disabled = true;
        try{
          const r = await api(isReg ? "register" : "login", { user, pass, name });
          TOKEN = r.token; UID = r.uid; UNAME = r.name || user;
          SINCE = 0; PUSHED = 0; saveSess();
          rebuildShadow();
          for (const k of SYNC_KINDS) for (const r2 of (S[k]||[])) r2.u = now();
          S.cfgU = now();
          closeSheet();
          await syncNow(true);
          render();
        }catch(e){
          $("#syGo").disabled = false;
          err(e.message === "taken" ? "اسم المستخدم محجوز" : e.message === "bad" ? "بيانات الدخول غلط" : e.message);
        }
      };
    });
  };
  draw();
}

/* =========================================================
   التشغيل
   ========================================================= */
$("#scrim").onclick = closeSheet;
$("#sheetX").onclick = closeSheet;
/* سحب الشيت لتحت يقفله */
(function sheetDrag(){
  const sh = $("#sheet"), grip = $(".sheet-grip"), head = $(".sheet-h");
  let y0 = 0, on = false, dy = 0;
  const start = e => { on = true; y0 = e.clientY; dy = 0; sh.style.transition = "none"; };
  const move = e => {
    if (!on) return;
    dy = Math.max(0, e.clientY - y0);
    sh.style.transform = `translateY(${dy}px)`;
  };
  const end = () => {
    if (!on) return;
    on = false; sh.style.transition = "";
    if (dy > 90) closeSheet(); else sh.style.transform = "";
  };
  [grip, head].forEach(el => {
    if (!el) return;
    el.addEventListener("pointerdown", e => { if (e.target.closest(".sheet-x")) return; start(e); });
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  });
})();
$("#fab").onclick = () => { buzz(); if (SCR === "centers") openDealForm(); else openMoveForm(SCR === "stock" ? "out" : "in"); };
$("#btnAlerts").onclick = () => { buzz(); openAlerts(); };
$("#btnNet").onclick = () => { buzz(); openNet(); };
$("#btnTheme").onclick = () => {
  const order = ["auto","light","dark"], i = order.indexOf(S.cfg.theme);
  setTheme(order[(i+1) % 3]); toast(themeLabel());
};
$$("#nav button").forEach(b => b.onclick = () => { buzz(6); go(b.dataset.scr); });
addEventListener("scroll", () => $("#topbar").classList.toggle("stuck", scrollY > 6), { passive:true });
addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if (e.key === "ArrowLeft" && !$("#sheet").classList.contains("on")) goBack();
});

/* سحب من حافة الشمال يرجّع للصفحة اللي قبلها */
(function edgeSwipe(){
  const edge = $("#edge"), hint = $("#edgeHint");
  if (!edge) return;
  let x0 = 0, y0 = 0, on = false;
  const show = (p) => { hint.style.opacity = Math.min(1, p).toFixed(2);
    hint.style.transform = `translate(${(-100 + Math.min(100, p*100))}%,-50%)`; };
  const reset = () => { on = false; hint.style.opacity = "0"; hint.style.transform = "translate(-100%,-50%)"; };
  edge.addEventListener("pointerdown", e => {
    on = true; x0 = e.clientX; y0 = e.clientY;
    try{ edge.setPointerCapture(e.pointerId); }catch(err){}
  });
  edge.addEventListener("pointermove", e => {
    if (!on) return;
    const dx = e.clientX - x0, dy = Math.abs(e.clientY - y0);
    if (dy > 60) return reset();
    if (dx > 0) show(dx / 90);
  });
  const end = e => {
    if (!on) return;
    const dx = (e.clientX || 0) - x0;
    reset();
    if (dx > 70){ buzz(10); goBack(); }
  };
  edge.addEventListener("pointerup", end);
  edge.addEventListener("pointercancel", reset);
})();

(async function init(){
  await load();
  setDigits(S.cfg.digits || "ar");
  setTheme(S.cfg.theme || "auto");
  if (MQ.addEventListener) MQ.addEventListener("change", () => setTheme(S.cfg.theme));
  bootAuth();
  $("#s-home").classList.add("on","anim");
  render();
  setTimeout(() => $("#s-home").classList.remove("anim"), 900);

  /* المزامنة */
  loadSess();
  rebuildShadow();
  paintSync();
  addEventListener("offline", paintNet);
  addEventListener("online", () => { paintNet(); if (TOKEN) syncNow(false); });
  paintNet();
  setInterval(paintNet, 5000);
  if (location.protocol !== "file:"){
    serverAlive().then(ok => { if (ok && TOKEN) syncNow(false); });
    setInterval(() => { if (TOKEN) syncNow(false); }, 15000);

    addEventListener("visibilitychange", () => { if (!document.hidden && TOKEN) syncNow(false); });
  }
  /* PWA */
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
